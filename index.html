<style>

*{
  box-sizing:border-box;
}

body{
  margin:0;
  background:#080808;
  color:#f5f5f5;
  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "Noto Sans TC",
    "PingFang TC",
    "Microsoft JhengHei",
    Arial,
    sans-serif;
}

.container{
  width:min(960px,calc(100% - 28px));
  margin:auto;
}

header{
  text-align:center;
  padding:42px 0 28px;
}

.brand{
  color:#d4af37;
  letter-spacing:5px;
  font-size:14px;
  font-weight:700;
  margin-bottom:12px;
}

h1{
  margin:0;
  font-size:clamp(30px,7vw,54px);
  letter-spacing:4px;
}

.subtitle{
  margin-top:10px;
  color:#999;
  font-size:14px;
}

.card{
  background:#141414;
  border:1px solid rgba(212,175,55,.28);
  border-radius:20px;
  padding:24px;
  margin-bottom:22px;
  box-shadow:0 18px 60px rgba(0,0,0,.35);
}

.section-title{
  display:flex;
  align-items:center;
  gap:10px;
  font-size:19px;
  font-weight:800;
  margin-bottom:20px;
}

.section-title:before{
  content:"";
  width:4px;
  height:22px;
  border-radius:5px;
  background:#d4af37;
}

.form-grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:18px;
}

.full{
  grid-column:1/-1;
}

label{
  display:block;
  color:#ddd;
  font-size:14px;
  font-weight:700;
  margin-bottom:8px;
}

input[type=text],
input[type=file],
select{
  width:100%;
  padding:13px 14px;
  border-radius:11px;
  border:1px solid #3d3d3d;
  background:#111;
  color:#fff;
  font-size:15px;
  outline:none;
}

input:focus,
select:focus{
  border-color:#d4af37;
}

.btn{
  border:0;
  border-radius:12px;
  padding:13px 20px;
  font-size:15px;
  font-weight:700;
  cursor:pointer;
}

.btn:disabled{
  opacity:.5;
  cursor:not-allowed;
}

.btn-gold{
  color:#111;
  background:linear-gradient(135deg,#f4d86b,#c89b2c);
}

.btn-dark{
  color:#eee;
  background:#252525;
  border:1px solid #444;
}

.btn-danger{
  color:#fff;
  background:#6e2020;
}

.btn-small{
  padding:8px 12px;
  font-size:13px;
}

.award-grid{
  display:grid;
  grid-template-columns:repeat(2,minmax(0,1fr));
  gap:10px;
}

.award-item{
  position:relative;
}

.award-item input{
  position:absolute;
  opacity:0;
}

.award-item label{
  display:flex;
  align-items:center;
  min-height:48px;
  padding:10px 13px;
  margin:0;
  border:1px solid #383838;
  border-radius:10px;
  background:#111;
  color:#ccc;
  cursor:pointer;
}

.award-item input:checked+label{
  border-color:#d4af37;
  background:rgba(212,175,55,.12);
  color:#f4d86b;
}

.hint{
  color:#888;
  font-size:12px;
  margin-top:7px;
  line-height:1.5;
}

.actions{
  display:flex;
  flex-wrap:wrap;
  gap:10px;
  margin-top:22px;
}

.message{
  display:none;
  padding:14px 16px;
  border-radius:11px;
  margin-bottom:18px;
  font-size:14px;
  line-height:1.6;
  white-space:pre-wrap;
}

.message.success{
  display:block;
  background:rgba(45,130,75,.16);
  border:1px solid rgba(75,180,105,.35);
  color:#9ee0b0;
}

.message.error{
  display:block;
  background:rgba(150,40,40,.16);
  border:1px solid rgba(210,80,80,.35);
  color:#ffaaaa;
}

.message.info{
  display:block;
  background:rgba(50,90,140,.16);
  border:1px solid rgba(80,140,210,.35);
  color:#a9cdf2;
}

.record{
  border:1px solid #343434;
  background:#101010;
  border-radius:14px;
  padding:16px;
  margin-bottom:12px;
}

.record-main{
  display:grid;
  grid-template-columns:80px 1fr;
  gap:14px;
  align-items:center;
}

.record-photo{
  width:80px;
  height:80px;
  border-radius:12px;
  object-fit:cover;
  background:#222;
}

.record-name{
  font-size:17px;
  font-weight:800;
  color:#f3d66a;
}

.record-meta{
  color:#999;
  font-size:13px;
  line-height:1.6;

}

.award-tags{
  display:flex;
  flex-wrap:wrap;

  margin-top:8px;
}

.tag{

  border-radius:999px;

.record-actions{

  gap:8px;

.empty{

  padding:28px 10px;

/* =========================================================
   SETTINGS
========================================================= */

async function loadSettings(){

  try{

    const ref =
      doc(
        db,
        "settings",
        "config"
      );

    const snap =
      await getDoc(
        ref
      );


    if(
      snap.exists()
    ){

      const data =
        snap.data();


      if(
        Array.isArray(
          data.platinumList
        )
      ){

        settings.platinumList =
          data.platinumList;

      }


      if(
        Array.isArray(
          data.awardList
        )
      ){

        settings.awardList =
          data.awardList;

      }

    }

  }catch(error){

    console.warn(
      "settings read failed",
      error
    );

  }

}


/* =========================================================
   RENDER SETTINGS
========================================================= */

function renderSettings(){

  platinumSelect.innerHTML =
    '<option value="">請選擇上線白金</option>';


  settings.platinumList.forEach(
    item=>{

      const option =
        document.createElement(
          "option"
        );

      option.value =
        item;

      option.textContent =
        item;

      platinumSelect.appendChild(
        option
      );

    }
  );


  awardGrid.innerHTML =
    "";


  settings.awardList.forEach(
    (award,index)=>{

      const id =
        "award_" +
        index;


      const wrapper =
        document.createElement(
          "div"
        );

      wrapper.className =
        "award-item";


      const input =
        document.createElement(
          "input"
        );

      input.type =
        "checkbox";

      input.name =
        "awards";

      input.id =
        id;

      input.value =
        award;


      const label =
        document.createElement(
          "label"
        );

      label.htmlFor =
        id;

      label.textContent =
        award;


      wrapper.appendChild(
        input
      );

      wrapper.appendChild(
        label
      );


      awardGrid.appendChild(
        wrapper
      );

    }
  );

}


/* =========================================================

photoInput.addEventListener(

    const file =

/* =========================================================
   COMPRESS IMAGE
========================================================= */

function compressImage(
  file
){

  return new Promise(
    (resolve,reject)=>{

      const reader =
        new FileReader();


      reader.onload =
        event=>{

          const img =
            new Image();


          img.onload =
            ()=>{

              const MAX =
                1600;


              let width =
                img.width;

              let height =
                img.height;


              if(
                width > MAX ||
                height > MAX
              ){

                if(
                  width > height
                ){

                  height =
                    Math.round(
                      height *
                      MAX /
                      width
                    );

                  width =
                    MAX;

                }else{

                  width =
                    Math.round(
                      width *
                      MAX /
                      height
                    );

                  height =
                    MAX;

                }

              }


              const canvas =
                document.createElement(
                  "canvas"
                );


              canvas.width =
                width;

              canvas.height =
                height;


              const ctx =
                canvas.getContext(
                  "2d"
                );


              ctx.drawImage(
                img,
                0,
                0,
                width,
                height
              );


              const dataUrl =
                canvas.toDataURL(
                  "image/jpeg",
                  .84
                );


              resolve({

                dataUrl:
                  dataUrl,

                fileName:
                  file.name
                    .replace(
                      /\.[^/.]+$/,
                      ""
                    ) +
                  ".jpg"

              });

            };


          img.onerror =
            ()=>reject(
              new Error(
                "圖片無法讀取"
              )
            );


          img.src =
            event.target.result;

        };


      reader.onerror =
        ()=>reject(
          new Error(
            "圖片讀取失敗"
          )
        );


      reader.readAsDataURL(
        file
      );

    }
  );

}


/* =========================================================

========================================================= */

function getSelectedAwards(){

      'input[name="awards"]:checked'

        "請輸入表揚者姓名。",
        "error"

      return;

    }


    if(!occupation){

        "請輸入表揚者職業。",
        "error"
      );

      !selectedPhoto
    ){

      showMessage(
        "請選擇表揚者照片。",
        "error"
      );

      return;

    }


    submitInProgress =
      true;

    submitBtn.disabled =
      true;

    cancelEditBtn.disabled =
      true;


    let recordId =
      editingRecordId;

    let newPhotoId =
      null;

    let oldPhotoId =
      editingRecord?.photoFileId ||
      "";


    try{

      /*
        =====================================================
        STEP 1
        先建立 / 確認 Firestore
        =====================================================
      */

      showMessage(
        "① 正在建立表揚資料……",
        "info"
      );


      if(!editingRecordId){

        /*
          自己產生 document ID。
        */

        const newRef =
          doc(
            collection(
              db,
              "recognitions"
            )
          );


        recordId =
          newRef.id;


        /*
          注意：

          這裡先不要求照片。
          因為照片在 Drive。

          Firestore 先建立，
          成功後才上傳照片。
        */

        await setDoc(
          newRef,
          {

            uid:
              currentUser.uid,

            email:
              currentUser.email || "",

            name:
              name,

            occupation:
              occupation,

            platinum:
              platinum,

            awards:
              awards,

            photoFileId:
              "",

            photoFileName:
              "",

            photoDriveUrl:
              "",

            createdAt:
              serverTimestamp(),

            updatedAt:
              serverTimestamp()

          }
        );

      }else{

        /*
          編輯資料。
        */

        const recordRef =
          doc(
            db,
            "recognitions",
            editingRecordId
          );


        await updateDoc(
          recordRef,
          {

            uid:
              currentUser.uid,

            email:
              currentUser.email || "",

            name:
              name,

            occupation:
              occupation,

            platinum:
              platinum,

            awards:
              awards,

            updatedAt:
              serverTimestamp()

          }
        );

      }


      /*
        =====================================================
        STEP 2
        Firestore 已經成功
        現在才處理照片
        =====================================================
      */

      if(selectedPhoto){

        showMessage(
          "② 表揚資料已建立，正在上傳照片……",
          "info"
        );


        const compressed =
          await compressImage(
            selectedPhoto
          );


        const photoInfo =
          await postToAppsScript({

            action:
              "uploadPhoto",

            idToken:
              await currentUser.getIdToken(
                true
              ),

            fileName:
              compressed.fileName,

            mimeType:
              "image/jpeg",

            base64:
              compressed.dataUrl

          });


        if(
          !photoInfo ||
          !photoInfo.fileId
        ){

          throw new Error(
            "Google Drive 沒有回傳有效的照片 fileId。"
          );

        }


        newPhotoId =
          photoInfo.fileId;


        /*
          ===================================================
          STEP 3
          Drive 成功
          更新 Firestore 照片資料
          ===================================================
        */

        showMessage(
          "③ 照片已上傳，正在完成資料……",
          "info"
        );


        const recordRef =
          doc(
            db,
            "recognitions",
            recordId
          );


        await updateDoc(
          recordRef,
          {

            photoFileId:
              photoInfo.fileId,

            photoFileName:
              photoInfo.fileName || "",

            photoDriveUrl:
              photoInfo.driveUrl || "",

            updatedAt:
              serverTimestamp()

          }
        );


        /*
          編輯換照片：
          Firestore 已經成功，
          才刪除舊照片。
        */

        if(
          editingRecordId &&
          oldPhotoId &&
          oldPhotoId !== newPhotoId
        ){

          try{

            await postToAppsScript({

              action:
                "deletePhoto",

              idToken:
                await currentUser.getIdToken(
                  true
                ),

              fileId:
                oldPhotoId

            });

          }catch(error){

            console.warn(
              "舊照片刪除失敗",
              error
            );

          }

        }

      }


      /*
        =====================================================
        成功
        =====================================================
      */

      showMessage(
        editingRecordId
          ? "✅ 表揚資料修改成功！"
          : "✅ 表揚資料提交成功！",
        "success"
      );


      resetForm();


      await loadMyRecords();


    }catch(error){

      console.error(
        "FINAL SUBMIT ERROR:",
        error
      );


      /*
        =====================================================
        如果：

        Firestore 已建立
        +
        Drive 也建立
        +
        最後 Firestore update 失敗

        這時候刪除剛剛的 Drive 照片，
        並把新建的 Firestore record 刪掉。
        =====================================================
      */

      if(
        !editingRecordId &&
        recordId
      ){

        try{

          await deleteDoc(
            doc(
              db,
              "recognitions",
              recordId
            )
          );

        }catch(cleanupError){

          console.warn(
            "Firestore cleanup failed",
            cleanupError
          );

        }

      }


      if(
        newPhotoId
      ){

        try{

          await postToAppsScript({

            action:
              "deletePhoto",

            idToken:
              await currentUser.getIdToken(
                true
              ),

            fileId:
              newPhotoId

          });

        }catch(cleanupError){

          console.warn(
            "Drive cleanup failed",
            cleanupError
          );

        }

      }


      showMessage(
        "❌ 提交失敗：\n\n" +
        getErrorMessage(error),
        "error"
      );


      /*
        這次會把真正 Firebase error code
        顯示出來。
      */

    }finally{

      submitInProgress =
        false;

      submitBtn.disabled =
        false;

      cancelEditBtn.disabled =
        false;

    }

  }
);


/* =========================================================
   LOAD MY RECORDS
========================================================= */

async function loadMyRecords(){

  recordsLoading.style.display =
    "block";

  recordsList.innerHTML =
    "";


  try{

    const q =
      query(
        collection(
          db,
          "recognitions"
        ),
        where(
          "uid",
          "==",
          currentUser.uid
        )
      );


    const snapshot =
      await getDocs(
        q
      );


    const records =
      [];


    snapshot.forEach(
      snap=>{

        records.push({

          id:
            snap.id,

          ...snap.data()

        });

      }
    );


    records.sort(
      (a,b)=>{

        const at =
          timestampValue(
            a.createdAt
          );

        const bt =
          timestampValue(
            b.createdAt
          );

        return bt-at;

      }
    );


    recordsLoading.style.display =
      "none";


    if(!records.length){

      recordsList.innerHTML =
        `
        <div class="empty">
          目前還沒有表揚資料。
        </div>
        `;

      return;

    }


    records.forEach(
      record=>{

        recordsList.appendChild(
          createRecordElement(
            record
          )
        );

      }
    );


  }catch(error){

    console.error(
      "LOAD ERROR",
      error
    );


    recordsLoading.style.display =
      "none";


    recordsList.innerHTML =
      `
      <div class="message error"
           style="display:block;">
        無法讀取資料。<br><br>
        ${escapeHtml(
          getErrorMessage(error)
        )}
      </div>
      `;

  }

}


/* =========================================================
   RECORD
========================================================= */

function createRecordElement(
  record
){

  const wrapper =
    document.createElement(
      "div"
    );

  wrapper.className =
    "record";


  const main =
    document.createElement(
      "div"
    );

  main.className =
    "record-main";


  const img =
    document.createElement(
      "img"
    );

  img.className =
    "record-photo";


  if(
    record.photoDriveUrl
  ){

    img.src =
      record.photoDriveUrl;

  }else{

    img.style.display =
      "none";

  }


  const content =
    document.createElement(
      "div"
    );


  const name =
    document.createElement(
      "div"
    );

  name.className =
    "record-name";

  name.textContent =
    record.name || "";


  const meta =
    document.createElement(
      "div"
    );

  meta.className =
    "record-meta";

  meta.textContent =
    (record.occupation || "") +
    " ｜ 上線白金：" +
    (record.platinum || "");


  const tags =
    document.createElement(
      "div"
    );

  tags.className =
    "award-tags";


  (
    Array.isArray(
      record.awards
    )
      ? record.awards
      : []
  ).forEach(
    award=>{

      const tag =
        document.createElement(
          "span"
        );

      tag.className =
        "tag";

      tag.textContent =
        award;

      tags.appendChild(
        tag
      );

    }
  );


  content.appendChild(
    name
  );

  content.appendChild(
    meta
  );

  content.appendChild(
    tags
  );


  main.appendChild(
    img
  );

  main.appendChild(
    content
  );


  const actions =
    document.createElement(
      "div"
    );

  actions.className =
    "record-actions";


  const editBtn =
    document.createElement(
      "button"
    );

  editBtn.className =
    "btn btn-dark btn-small";

  editBtn.textContent =
    "修改";

  editBtn.type =
    "button";


  editBtn.onclick =
    ()=>{
      startEdit(
        record
      );
    };


  const deleteBtn =
    document.createElement(
      "button"
    );

  deleteBtn.className =
    "btn btn-danger btn-small";

  deleteBtn.textContent =
    "刪除";

  deleteBtn.type =
    "button";


  deleteBtn.onclick =
    ()=>{
      deleteRecord(
        record
      );
    };


  actions.appendChild(
    editBtn
  );

  actions.appendChild(
    deleteBtn
  );


  wrapper.appendChild(
    main
  );

  wrapper.appendChild(
    actions
  );


  return wrapper;

}


/* =========================================================
   EDIT
========================================================= */

function startEdit(
  record
){

  editingRecordId =
    record.id;

  editingRecord =
    record;


  formTitle.textContent =
    "修改表揚資料";


  nameInput.value =
    record.name || "";


  occupationInput.value =
    record.occupation || "";


  platinumSelect.value =
    record.platinum || "";


  document
    .querySelectorAll(
      'input[name="awards"]'
    )
    .forEach(
      input=>{

        input.checked =
          Array.isArray(
            record.awards
          ) &&
          record.awards.includes(
            input.value
          );

      }
    );


  photoInput.value =
    "";


  existingPhoto.textContent =
    record.photoFileId
      ? "目前已有照片。如果不選新照片，會保留原照片。"
      : "";


  preview.style.display =
    "none";


  submitBtn.textContent =
    "儲存修改";


  cancelEditBtn.style.display =
    "inline-block";


  formSection.scrollIntoView({
    behavior:"smooth"
  });

}


/* =========================================================
   CANCEL
========================================================= */

cancelEditBtn.addEventListener(
  "click",
  ()=>{
    resetForm();
    clearMessage();
  }
);


/* =========================================================
   RESET
========================================================= */

function resetForm(){

  editingRecordId =
    null;

  editingRecord =
    null;


  form.reset();


  formTitle.textContent =
    "新增表揚資料";


  submitBtn.textContent =
    "提交表揚資料";


  cancelEditBtn.style.display =
    "none";


  existingPhoto.textContent =
    "";


  preview.style.display =
    "none";

}


/* =========================================================
   DELETE
========================================================= */

async function deleteRecord(
  record
){

  if(!currentUser){
    return;
  }


  if(
    !confirm(
      "確定要刪除「" +
      record.name +
      "」嗎？"
    )
  ){
    return;
  }


  try{

    showMessage(
      "正在刪除資料……",
      "info"
    );


    await deleteDoc(
      doc(
        db,
        "recognitions",
        record.id
      )
    );


    if(
      record.photoFileId
    ){

      try{

        await postToAppsScript({

          action:
            "deletePhoto",

          idToken:
            await currentUser.getIdToken(
              true
            ),

          fileId:
            record.photoFileId

        });

      }catch(error){

        console.warn(
          "Drive delete failed",
          error
        );

      }

    }


    showMessage(
      "資料已刪除。",
      "success"
    );


    await loadMyRecords();


  }catch(error){

    console.error(
      error
    );


    showMessage(
      "刪除失敗：\n" +
      getErrorMessage(error),
      "error"
    );

  }

}


/* =========================================================
   APPS SCRIPT POST
========================================================= */

/* =========================================================
   APPS SCRIPT POST
   完整新版
========================================================= */

function postToAppsScript(
  data
){

  return new Promise(
    (resolve,reject)=>{

      if(
        !APPS_SCRIPT_URL ||
        !APPS_SCRIPT_URL.includes(
          "script.google.com/macros/s/"
        )
      ){

        reject(
          new Error(
            "Apps Script /exec URL 沒有正確設定。"
          )
        );

        return;

      }


      const iframe =
        document.getElementById(
          "gasFrame"
        );


      if(!iframe){

        reject(
          new Error(
            "找不到 gasFrame iframe。"
          )
        );

        return;

      }


      /*
       * ===================================================
       * 建立唯一 requestId
       * ===================================================
       */

      const requestId =
        "req_" +
        Date.now() +
        "_" +
        Math.random()
          .toString(36)
          .substring(
            2,
            10
          );


      /*
       * 將 requestId 一起傳給 Apps Script
       */

      const requestData = {

        ...data,

        requestId:
          requestId

      };


      /*
       * ===================================================
       * 建立 POST FORM
       * ===================================================
       */

      const form =
        document.createElement(
          "form"
        );


      form.method =
        "POST";


      form.action =
        APPS_SCRIPT_URL;


      form.target =
        "gasFrame";


      form.style.display =
        "none";


      Object.keys(
        requestData
      )
      .forEach(
        key=>{

          const input =
            document.createElement(
              "input"
            );


          input.type =
            "hidden";


          input.name =
            key;


          input.value =
            requestData[key] ?? "";


          form.appendChild(
            input
          );

        }
      );


      document.body.appendChild(
        form
      );


      /*
       * ===================================================
       * 狀態
       * ===================================================
       */

      let finished =
        false;


      /*
       * ===================================================
       * 5 分鐘逾時
       * ===================================================
       */

      const timeout =
        setTimeout(
          ()=>{

            if(
              finished
            ){

              return;

            }


            finished =
              true;


            cleanup();


            reject(
              new Error(
                "Google Drive 服務回覆逾時。\n\n" +
                "照片可能已經成功上傳到 Google Drive，" +
                "但前端沒有收到 Apps Script 的完成訊號。\n\n" +
                "請先不要重複提交。"
              )
            );

          },
          300000
        );


      /*
       * ===================================================
       * 清理
       * ===================================================
       */

      function cleanup(){

        clearTimeout(
          timeout
        );


        window.removeEventListener(
          "message",
          onMessage
        );


        try{

          form.remove();

        }catch(error){}

      }


      /*
       * ===================================================
       * 收到 Apps Script 回覆
       * ===================================================
       */

      function onMessage(
        event
      ){

        const result =
          event.data;


        /*
         * 必須是 object
         */

        if(
          !result ||
          typeof result !==
          "object"
        ){

          return;

        }


        /*
         * 只接受我們需要的 action
         */

        if(
          result.action !==
            "uploadPhoto" &&

          result.action !==
            "deletePhoto" &&

          result.action !==
            "generatePpt"
        ){

          return;

        }


        /*
         * 如果有 requestId，
         * 必須是目前這次請求。
         */

        if(
          result.requestId &&
          result.requestId !==
          requestId
        ){

          return;

        }


        /*
         * 已經完成就不要再處理。
         */

        if(
          finished
        ){

          return;

        }


        finished =
          true;


        cleanup();


        /*
         * 成功
         */

        if(
          result.success
        ){

          resolve(
            result.result
          );

          return;

        }


        /*
         * Apps Script 回傳錯誤
         */

        reject(
          new Error(
            result.error ||
            "Apps Script 執行失敗"
          )
        );

      }


      /*
       * ===================================================
       * 一定先監聽 message
       * 再 submit
       * ===================================================
       */

      window.addEventListener(
        "message",
        onMessage
      );


      try{

        form.submit();

      }catch(error){

        if(
          !finished
        ){

          finished =
            true;


          cleanup();


          reject(
            error
          );

        }

      }

    }
  );

}

/* =========================================================
   ERROR
========================================================= */

function getErrorMessage(
  error
){

  if(!error){
    return "未知錯誤";
  }


  const code =
    error.code || "";


  const message =
    error.message ||
    String(error);


  return (
    "錯誤代碼：" +
    (code || "無") +
    "\n\n" +
    "錯誤內容：" +
    message
  );

}


/* =========================================================
   TIMESTAMP
========================================================= */

function timestampValue(
  value
){

  if(!value){
    return 0;
  }


  if(
    typeof value.toMillis ===
    "function"
  ){

    return value.toMillis();

  }


  if(
    value.seconds !== undefined
  ){

    return (
      Number(value.seconds) *
      1000
    );

  }


  return 0;

}


/* =========================================================
   ESCAPE
========================================================= */

function escapeHtml(
  value
){

  return String(value)
    .replace(
      /&/g,
      "&amp;"
    )
    .replace(
      /</g,
      "&lt;"
    )
    .replace(
      />/g,
      "&gt;"
    )
    .replace(
      /"/g,
      "&quot;"
    )
    .replace(
      /'/g,
      "&#039;"
    );

}
