<title>BS GLOBAL｜榮耀時刻表揚</title>

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;

    color: #ffffff;
    font-family:
        -apple-system,

        "PingFang TC",

}

.container {
    width: 100%;

    padding: 25px 18px 60px;
}

.header {
    text-align: center;
    margin-bottom: 28px;
}

.logo {
    color: #d4af37;
    font-size: 13px;
    letter-spacing: 4px;
    font-weight: 700;
    margin-bottom: 10px;
}

.title {
    font-size: 32px;
    font-weight: 800;
    letter-spacing: 2px;
    margin: 0;
}

.subtitle {
    color: #aaa;
    margin-top: 8px;
    font-size: 14px;
}

.card {
    background: rgba(20,20,20,.94);
    border: 1px solid #333;
    border-radius: 18px;
    padding: 22px;
    margin-bottom: 18px;
    box-shadow:
        0 15px 40px rgba(0,0,0,.35);
}

.card-title {
    font-size: 18px;
    font-weight: 700;
    margin-bottom: 18px;
    color: #d4af37;
}

.user-box {
    display: flex;
    align-items: center;
    gap: 12px;
    background: #151515;
    border: 1px solid #333;
    border-radius: 12px;
    padding: 12px;
    margin-bottom: 20px;
}

.user-avatar {
    width: 42px;
    height: 42px;
    border-radius: 50%;
    object-fit: cover;
}

.user-email {
    font-size: 13px;
    color: #aaa;
    word-break: break-all;
}

label {
    display: block;
    font-size: 14px;
    color: #ddd;
    margin-bottom: 7px;
}

.required {
    color: #d4af37;
}

input,
select {
    width: 100%;
    background: #0e0e0e;
    color: #fff;
    border: 1px solid #444;
    border-radius: 10px;
    padding: 13px 14px;
    font-size: 15px;
    outline: none;
}

input:focus,
select:focus {
    border-color: #d4af37;
}

.form-group {
    margin-bottom: 18px;
}

.photo-preview {
    width: 150px;
    height: 150px;
    border-radius: 14px;
    border: 1px solid #444;
    object-fit: cover;
    display: none;
    margin-top: 12px;
}

.award-grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 9px;
}

.award-item {
    position: relative;
}

.award-item input {
    position: absolute;
    opacity: 0;
    pointer-events: none;
}

.award-item label {
    margin: 0;
    border: 1px solid #444;
    border-radius: 10px;
    padding: 11px 10px;
    font-size: 13px;
    color: #bbb;
    cursor: pointer;
    min-height: 48px;
    display: flex;
    align-items: center;
    transition: .2s;
}

.award-item input:checked + label {
    background: rgba(212,175,55,.13);
    border-color: #d4af37;
    color: #d4af37;
}

button {
    width: 100%;
    border: none;
    border-radius: 12px;
    padding: 14px;
    font-size: 15px;
    font-weight: 700;
    cursor: pointer;
    transition: .2s;
}

.btn-gold {
    background: linear-gradient(
        135deg,
        #b88a18,
        #d4af37,
        #f1d778
    );
    color: #111;
}

.btn-gold:hover {
    transform: translateY(-1px);
}

.btn-dark {
    background: #222;
    color: #ddd;
    border: 1px solid #444;
    margin-top: 10px;
}

.btn-danger {
    background: #321414;
    color: #ff8f8f;
    border: 1px solid #633;
}

.status {
    display: none;
    padding: 12px;
    border-radius: 10px;
    margin-bottom: 15px;
    font-size: 14px;
    line-height: 1.5;
}

.status.success {
    display: block;
    background: #102b1b;
    border: 1px solid #28633d;
    color: #8fe0aa;
}

.status.error {
    display: block;
    background: #321414;
    border: 1px solid #633;
    color: #ff9d9d;
}

.status.info {
    display: block;
    background: #172333;
    border: 1px solid #34516f;
    color: #a8d1ff;
}

.record {
    background: #111;
    border: 1px solid #333;
    border-radius: 14px;
    padding: 15px;
    margin-bottom: 12px;
}

.record-name {
    font-size: 17px;
    font-weight: 700;
}

.record-meta {
    color: #999;
    font-size: 13px;
    margin-top: 5px;
}

.tags {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    margin-top: 10px;
}

.tag {
    background: rgba(212,175,55,.12);
    border: 1px solid #705b20;
    color: #d4af37;
    border-radius: 20px;
    padding: 4px 8px;
    font-size: 11px;
}

.record-actions {
    display: flex;
    gap: 8px;
    margin-top: 12px;
}

.record-actions button {
    width: auto;
    flex: 1;
    padding: 9px;
    font-size: 13px;
}

.hidden {
    display: none !important;
}

.login-screen {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
}

.login-box {
    width: 100%;
    max-width: 430px;
    text-align: center;
    background: rgba(18,18,18,.95);
    border: 1px solid #333;
    border-radius: 20px;
    padding: 35px 25px;
}

.login-logo {
    color: #d4af37;
    font-size: 14px;
    letter-spacing: 5px;
    margin-bottom: 15px;
}

.login-title {
    font-size: 28px;
    font-weight: 800;
    margin-bottom: 8px;
}

.login-description {
    color: #999;
    font-size: 14px;
    line-height: 1.7;
    margin-bottom: 25px;
}

.loading {

    color: #aaa;

}

.topbar {
    display: flex;

    margin-bottom: 20px;
}

.logout {

    padding: 8px 12px;
    background: #222;
    border: 1px solid #444;
    color: #bbb;
    font-size: 12px;
}

.admin-link {
    display: block;
    text-align: center;

    font-size: 12px;

}

.edit-mode {
    color: #d4af37;

    border: 1px solid #705b20;
    padding: 10px;

}

@media(max-width:600px) {

<script type="module">

import {
    initializeApp
} from "https://www.gstatic.com/firebasejs/12.0.0/firebase-app.js";

import {
    getAuth,
    GoogleAuthProvider,
    signInWithPopup,
    signOut,
    onAuthStateChanged
} from "https://www.gstatic.com/firebasejs/12.0.0/firebase-auth.js";

import {
    getFirestore,
    collection,
    addDoc,
    updateDoc,
    deleteDoc,
    doc,
    getDoc,
    getDocs,
    query,
    where,
    serverTimestamp
} from "https://www.gstatic.com/firebasejs/12.0.0/firebase-firestore.js";

import {
    firebaseConfig,
    APPS_SCRIPT_URL
} from "./js/firebase-config.js";


/* ============================================================
   Firebase 初始化
============================================================ */

const app = initializeApp(firebaseConfig);

const auth = getAuth(app);

const db = getFirestore(app);

const provider = new GoogleAuthProvider();

provider.setCustomParameters({
    prompt: "select_account"
});


/* ============================================================
   DOM
============================================================ */

const loginScreen =
    document.getElementById("loginScreen");

const mainScreen =
    document.getElementById("mainScreen");

const loginBtn =
    document.getElementById("loginBtn");

const logoutBtn =
    document.getElementById("logoutBtn");

const loginError =
    document.getElementById("loginError");

const statusBox =
    document.getElementById("statusBox");

const submitBtn =
    document.getElementById("submitBtn");

const cancelEditBtn =
    document.getElementById("cancelEditBtn");

const editModeBox =
    document.getElementById("editModeBox");

const recordsList =
    document.getElementById("recordsList");

const photoInput =
    document.getElementById("photo");

const photoPreview =
    document.getElementById("photoPreview");

const nameInput =
    document.getElementById("name");

const occupationInput =
    document.getElementById("occupation");

const platinumSelect =
    document.getElementById("platinum");

const awardGrid =
    document.getElementById("awardGrid");


/* ============================================================
   狀態
============================================================ */

let currentUser = null;

let currentRecords = [];

let editingId = null;

let editingOldPhotoId = null;

let currentSettings = {
    platinumList: [],
    awardList: []
};


/* ============================================================
   防止 Google Popup 重複開啟
============================================================ */

let loginInProgress = false;


/* ============================================================
   預設資料
============================================================ */

const DEFAULT_PLATINUMS = [

    "Sense&Lavenier",
    "Amos",
    "Sunny",
    "Robin&Zoey",
    "RyanLio",
    "Wyane&Momo",
    "Jess",
    "SzeChew",
    "Lynn",
    "Keong&Ngah"

];


const DEFAULT_AWARDS = [

    "Silver Inner Circle",
    "Gold Inner Circle",
    "100% User",
    "100ppv",
    "3%",
    "300ppv",
    "600ppv",
    "6%",
    "1000ppv",
    "9%",
    "12%",
    "Bronze Foundation",
    "15%",
    "18%",
    "Bronze Builder",
    "Core",
    "Super core",
    "Silver producer",
    "Gold producer",
    "Platinum",
    "Founder Platinum"

];


/* ============================================================
   HTML Escape
============================================================ */

function escapeHtml(value) {

    return String(value ?? "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");

}


/* ============================================================
   顯示訊息
============================================================ */

function showStatus(message, type = "info") {

    statusBox.className =
        "status " + type;

    statusBox.textContent =
        message;

}


/* ============================================================
   清除訊息
============================================================ */

function clearStatus() {

    statusBox.className = "status";

    statusBox.textContent = "";

}


/* ============================================================
   Google Login
============================================================ */

async function loginWithGoogle() {

    if (loginInProgress) {
        return;
    }

    if (auth.currentUser) {
        return;
    }

    loginInProgress = true;

    loginBtn.disabled = true;

    loginBtn.textContent =
        "Google 登入中...";

    loginError.className =
        "status";

    loginError.textContent = "";

    try {

        await signInWithPopup(
            auth,
            provider
        );

    } catch (error) {

        console.error(
            "Google Login Error:",
            error
        );

        if (
            error.code ===
            "auth/cancelled-popup-request"
        ) {

            loginError.className =
                "status error";

            loginError.textContent =
                "Google 登入視窗正在處理中，請不要重複點擊登入按鈕。";

        } else if (
            error.code ===
            "auth/popup-closed-by-user"
        ) {

            loginError.className =
                "status error";

            loginError.textContent =
                "Google 登入視窗已關閉，請重新點擊登入。";

        } else {

            loginError.className =
                "status error";

            loginError.textContent =
                "Google 登入失敗：" +
                (error.message || error.code);

        }

    } finally {

        setTimeout(() => {

            loginInProgress = false;

            loginBtn.disabled = false;

            loginBtn.textContent =
                "使用 Google 登入";

        }, 800);

    }

}


loginBtn.addEventListener(
    "click",
    loginWithGoogle
);


/* ============================================================
   登出
============================================================ */

logoutBtn.addEventListener(
    "click",
    async () => {

        await signOut(auth);

    }
);


/* ============================================================
   Auth 狀態
============================================================ */

onAuthStateChanged(
    auth,
    async (user) => {

        currentUser = user;

        if (!user) {

            mainScreen.classList.add(
                "hidden"
            );

            loginScreen.classList.remove(
                "hidden"
            );

            return;

        }


        loginScreen.classList.add(
            "hidden"
        );

        mainScreen.classList.remove(
            "hidden"
        );


        document.getElementById(
            "userEmail"
        ).textContent =
            user.email || "";


        document.getElementById(
            "userAvatar"
        ).src =
            user.photoURL ||
            "https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg";


        await loadSettings();

        await loadMyRecords();

    }
);


/* ============================================================
   載入設定
============================================================ */

async function loadSettings() {

    try {

        const ref =
            doc(
                db,
                "settings",
                "config"
            );

        const snap =
            await getDoc(ref);


        if (snap.exists()) {

            const data = snap.data();

            currentSettings = {

                platinumList:
                    Array.isArray(data.platinumList)
                        ? data.platinumList
                        : DEFAULT_PLATINUMS,

                awardList:
                    Array.isArray(data.awardList)
                        ? data.awardList
                        : DEFAULT_AWARDS

            };

        } else {

            currentSettings = {

                platinumList:
                    DEFAULT_PLATINUMS,

                awardList:
                    DEFAULT_AWARDS

            };

        }

    } catch (error) {

        console.error(error);

        currentSettings = {

            platinumList:
                DEFAULT_PLATINUMS,

            awardList:
                DEFAULT_AWARDS

        };

    }


    renderPlatinumList();

    renderAwardList();

}


/* ============================================================
   白金列表
============================================================ */

function renderPlatinumList() {

    platinumSelect.innerHTML = `
        <option value="">
            請選擇上線白金
        </option>
    `;

    currentSettings.platinumList
        .forEach(name => {

            const option =
                document.createElement(
                    "option"
                );

            option.value = name;

            option.textContent = name;

            platinumSelect.appendChild(
                option
            );

        });

}


/* ============================================================
   獎銜列表
============================================================ */

function renderAwardList() {

    awardGrid.innerHTML = "";

    currentSettings.awardList
        .forEach(
            (award, index) => {

                const wrapper =
                    document.createElement(
                        "div"
                    );

                wrapper.className =
                    "award-item";

                const id =
                    "award_" + index;

                wrapper.innerHTML = `

                    <input
                        type="checkbox"
                        id="${id}"
                        value="${escapeHtml(award)}"
                    >

                    <label for="${id}">
                        ${escapeHtml(award)}
                    </label>

                `;

                awardGrid.appendChild(
                    wrapper
                );

            }
        );

}


/* ============================================================
   取得選中的獎銜
============================================================ */

function getSelectedAwards() {

    return Array.from(
        awardGrid.querySelectorAll(
            "input[type=checkbox]:checked"
        )
    ).map(
        checkbox =>
            checkbox.value
    );

}


/* ============================================================
   清除表單
============================================================ */

function resetForm() {

    editingId = null;

    editingOldPhotoId = null;

    nameInput.value = "";

    occupationInput.value = "";

    platinumSelect.value = "";

    photoInput.value = "";

    photoPreview.src = "";

    photoPreview.style.display =
        "none";


    awardGrid
        .querySelectorAll(
            "input[type=checkbox]"
        )
        .forEach(
            checkbox =>
                checkbox.checked = false
        );


    editModeBox.classList.add(
        "hidden"
    );

    cancelEditBtn.classList.add(
        "hidden"
    );

    submitBtn.textContent =
        "提交表揚資料";

}


/* ============================================================
   圖片壓縮
============================================================ */

async function prepareImage(file) {

    return new Promise(
        (resolve, reject) => {

            const url =
                URL.createObjectURL(file);

            const img =
                new Image();

            img.onload = () => {

                URL.revokeObjectURL(url);


                const maxSize = 1400;

                let width =
                    img.naturalWidth;

                let height =
                    img.naturalHeight;


                if (
                    width > maxSize ||
                    height > maxSize
                ) {

                    const scale =
                        Math.min(
                            maxSize / width,
                            maxSize / height
                        );

                    width =
                        Math.round(
                            width * scale
                        );

                    height =
                        Math.round(
                            height * scale
                        );

                }


                const canvas =
                    document.createElement(
                        "canvas"
                    );

                canvas.width =
                    width;

                canvas.height =
                    height;


                const ctx =
                    canvas.getContext(
                        "2d"
                    );

                ctx.drawImage(
                    img,
                    0,
                    0,
                    width,
                    height
                );


                canvas.toBlob(
                    blob => {

                        if (!blob) {

                            reject(
                                new Error(
                                    "圖片處理失敗"
                                )
                            );

                            return;

                        }

                        resolve(blob);

                    },
                    "image/jpeg",
                    0.86
                );

            };


            img.onerror = () => {

                URL.revokeObjectURL(url);

                reject(
                    new Error(
                        "無法讀取照片"
                    )
                );

            };


            img.src = url;

        }
    );

}


/* ============================================================
   Blob → Base64
============================================================ */

function blobToBase64(blob) {

    return new Promise(
        (resolve, reject) => {

            const reader =
                new FileReader();

            reader.onloadend = () => {

                const result =
                    reader.result;

                resolve(
                    result.split(",")[1]
                );

            };

            reader.onerror =
                reject;

            reader.readAsDataURL(
                blob
            );

        }
    );

}


/* ============================================================
   Apps Script POST
============================================================ */

function postToAppsScript(data) {

  return new Promise((resolve, reject) => {

    const iframe =
      document.getElementById("gasFrame");

    if (!iframe) {

      reject(
        new Error("找不到 gasFrame")
      );

      return;

    }


    const form =
      document.createElement("form");

    form.method = "POST";

    form.action =
      APPS_SCRIPT_URL;

    form.target =
      "gasFrame";

    form.style.display =
      "none";


    Object.keys(data).forEach(key => {

      const input =
        document.createElement("input");

      input.type =
        "hidden";

      input.name =
        key;

      input.value =
        data[key] ?? "";

      form.appendChild(
        input
      );

    });


    document.body.appendChild(
      form
    );


    let finished = false;


    const timeout =
      setTimeout(() => {

        if (finished) {
          return;
        }

        finished = true;

        cleanup();

        reject(
          new Error(
            "Google Drive 服務逾時，請稍後再試。"
          )
        );

      }, 240000);


    function cleanup() {

      clearTimeout(
        timeout
      );

      window.removeEventListener(
        "message",
        messageHandler
      );

      try {

        form.remove();

      } catch (e) {}

    }


    function messageHandler(event) {

      const result =
        event.data;


      if (
        !result ||
        typeof result !== "object"
      ) {

        return;

      }


      if (
        result.action !==
          "uploadPhoto" &&
        result.action !==
          "deletePhoto" &&
        result.action !==
          "generatePpt"
      ) {

        return;

      }


      if (finished) {
        return;
      }


      finished = true;

      cleanup();


      if (
        result.success
      ) {

        resolve(
          result.result
        );

      } else {

        reject(
          new Error(
            result.error ||
            "Google Apps Script 執行失敗"
          )
        );

      }

    }


    window.addEventListener(
      "message",
      messageHandler
    );


    try {

      form.submit();

    } catch (error) {

      if (!finished) {

        finished = true;

        cleanup();

        reject(
          error
        );

      }

    }

  });

}
/* ============================================================
   上傳照片
============================================================ */

async function uploadPhoto(
    file
) {

    const compressed =
        await prepareImage(file);

    const base64 =
        await blobToBase64(
            compressed
        );


    const token =
        await currentUser.getIdToken(
            true
        );


    const result =
        await postToAppsScript({

            action:
                "uploadPhoto",

            idToken:
                token,

            fileName:
                file.name,

            mimeType:
                "image/jpeg",

            base64:
                base64

        });


    return result;

}


/* ============================================================
   刪除照片
============================================================ */

async function deletePhoto(
    fileId
) {

    if (!fileId) {
        return;
    }


    const token =
        await currentUser.getIdToken(
            true
        );


    return postToAppsScript({

        action:
            "deletePhoto",

        idToken:
            token,

        fileId:
            fileId

    });

}


/* ============================================================
   提交
============================================================ */

submitBtn.addEventListener(
    "click",
    async () => {

        clearStatus();


        if (!currentUser) {

            showStatus(
                "請先登入 Google。",
                "error"
            );

            return;

        }


        const name =
            nameInput.value.trim();

        const occupation =
            occupationInput.value.trim();

        const platinum =
            platinumSelect.value;

        const awards =
            getSelectedAwards();

        const photoFile =
            photoInput.files[0];


        if (!name) {

            showStatus(
                "請輸入表揚者姓名。",
                "error"
            );

            return;

        }


        if (!occupation) {

            showStatus(
                "請輸入表揚者職業。",
                "error"
            );

            return;

        }


        if (!platinum) {

            showStatus(
                "請選擇上線白金。",
                "error"
            );

            return;

        }


        if (!awards.length) {

            showStatus(
                "至少選擇一個突破獎銜。",
                "error"
            );

            return;

        }


        if (
            !editingId &&
            !photoFile
        ) {

            showStatus(
                "請上傳表揚者照片。",
                "error"
            );

            return;

        }


        submitBtn.disabled = true;

        submitBtn.textContent =
            "資料處理中...";


        let newPhoto = null;


        try {

            /* =================================================
               如果有新照片 → 上傳
            ================================================= */

            if (photoFile) {

                showStatus(
                    "正在上傳及最佳化照片...",
                    "info"
                );


                newPhoto =
                    await uploadPhoto(
                        photoFile
                    );

            }


            const data = {

                uid:
                    currentUser.uid,

                email:
                    currentUser.email,

                name:
                    name,

                occupation:
                    occupation,

                platinum:
                    platinum,

                awards:
                    awards,

                updatedAt:
                    serverTimestamp()

            };


            if (newPhoto) {

                data.photoFileId =
                    newPhoto.fileId;

                data.photoFileName =
                    newPhoto.fileName;

                data.photoDriveUrl =
                    newPhoto.driveUrl;

            }


            /* =================================================
               新增
            ================================================= */

            if (!editingId) {

                data.createdAt =
                    serverTimestamp();


                try {

                    await addDoc(
                        collection(
                            db,
                            "recognitions"
                        ),
                        data
                    );

                } catch (firestoreError) {

                    if (
                        newPhoto &&
                        newPhoto.fileId
                    ) {

                        try {

                            await deletePhoto(
                                newPhoto.fileId
                            );

                        } catch (_) {}

                    }

                    throw firestoreError;

                }


                showStatus(
                    "表揚資料提交成功！",
                    "success"
                );

            }

            /* =================================================
               修改
            ================================================= */

            else {

                const oldPhotoId =
                    editingOldPhotoId;


                const updateData =
                    { ...data };


                await updateDoc(
                    doc(
                        db,
                        "recognitions",
                        editingId
                    ),
                    updateData
                );


                /* =============================================
                   Firestore 成功後才刪除舊照片
                ============================================= */

                if (
                    newPhoto &&
                    oldPhotoId &&
                    oldPhotoId !==
                        newPhoto.fileId
                ) {

                    try {

                        await deletePhoto(
                            oldPhotoId
                        );

                    } catch (deleteError) {

                        console.warn(
                            "舊照片刪除失敗：",
                            deleteError
                        );

                    }

                }


                showStatus(
                    "表揚資料修改成功！",
                    "success"
                );

            }


            resetForm();

            await loadMyRecords();


        } catch (error) {

            console.error(error);

            if (
                newPhoto &&
                newPhoto.fileId
            ) {

                try {

                    await deletePhoto(
                        newPhoto.fileId
                    );

                } catch (_) {}

            }


            showStatus(
                "提交失敗：" +
                (error.message ||
                    error),
                "error"
            );

        } finally {

            submitBtn.disabled =
                false;

            submitBtn.textContent =
                editingId
                    ? "儲存修改"
                    : "提交表揚資料";

        }

    }
);


/* ============================================================
   載入自己的資料
============================================================ */

async function loadMyRecords() {

    if (!currentUser) {
        return;
    }


    recordsList.innerHTML = `
        <div class="loading">
            載入資料中...
        </div>
    `;


    try {

        const q =
            query(
                collection(
                    db,
                    "recognitions"
                ),
                where(
                    "uid",
                    "==",
                    currentUser.uid
                )
            );


        const snapshot =
            await getDocs(q);


        currentRecords =
            snapshot.docs.map(
                docSnap => ({

                    id:
                        docSnap.id,

                    ...docSnap.data()

                })
            );


        currentRecords.sort(
            (a, b) => {

                const aTime =
                    a.createdAt?.seconds ||
                    0;

                const bTime =
                    b.createdAt?.seconds ||
                    0;

                return bTime - aTime;

            }
        );


        renderRecords();


    } catch (error) {

        console.error(error);

        recordsList.innerHTML = `
            <div class="status error">
                無法讀取資料：${escapeHtml(
                    error.message
                )}
            </div>
        `;

    }

}


/* ============================================================
   Render Records
============================================================ */

function renderRecords() {

    if (!currentRecords.length) {

        recordsList.innerHTML = `
            <div
                style="
                    color:#777;
                    text-align:center;
                    padding:25px;
                ">
                目前還沒有表揚資料
            </div>
        `;

        return;

    }


    recordsList.innerHTML =
        currentRecords
            .map(record => {

                const awards =
                    Array.isArray(
                        record.awards
                    )
                        ? record.awards
                        : [];


                const tags =
                    awards
                        .map(
                            award =>
                                `<span class="tag">
                                    ${escapeHtml(
                                        award
                                    )}
                                </span>`
                        )
                        .join("");


                return `

                    <div class="record">

                        <div class="record-name">
                            ${escapeHtml(
                                record.name
                            )}
                        </div>

                        <div class="record-meta">
                            ${escapeHtml(
                                record.occupation
                            )}
                            ·
                            上線：
                            ${escapeHtml(
                                record.platinum
                            )}
                        </div>

                        <div class="tags">
                            ${tags}
                        </div>

                        <div class="record-actions">

                            <button
                                class="btn-dark"
                                onclick="window.editRecord('${record.id}')">
                                修改
                            </button>

                            <button
                                class="btn-danger"
                                onclick="window.removeRecord('${record.id}')">
                                刪除
                            </button>

                        </div>

                    </div>

                `;

            })
            .join("");

}


/* ============================================================
   修改資料
============================================================ */

window.editRecord =
    function(id) {

        const record =
            currentRecords.find(
                item =>
                    item.id === id
            );


        if (!record) {
            return;
        }


        editingId =
            record.id;

        editingOldPhotoId =
            record.photoFileId ||
            null;


        nameInput.value =
            record.name || "";

        occupationInput.value =
            record.occupation || "";

        platinumSelect.value =
            record.platinum || "";


        awardGrid
            .querySelectorAll(
                "input[type=checkbox]"
            )
            .forEach(
                checkbox => {

                    checkbox.checked =
                        Array.isArray(
                            record.awards
                        ) &&
                        record.awards.includes(
                            checkbox.value
                        );

                }
            );


        photoInput.value = "";

        if (record.photoDriveUrl) {

            photoPreview.src =
                record.photoDriveUrl;

            photoPreview.style.display =
                "block";

        }


        editModeBox.classList.remove(
            "hidden"
        );

        cancelEditBtn.classList.remove(
            "hidden"
        );

        submitBtn.textContent =
            "儲存修改";


        window.scrollTo({
            top: 0,
            behavior: "smooth"
        });

    };


/* ============================================================
   取消修改
============================================================ */

cancelEditBtn.addEventListener(
    "click",
    () => {

        resetForm();

    }
);


/* ============================================================
   刪除資料
============================================================ */

window.removeRecord =
    async function(id) {

        const record =
            currentRecords.find(
                item =>
                    item.id === id
            );


        if (!record) {
            return;
        }


        const confirmed =
            confirm(
                `確定要刪除「${record.name}」的表揚資料嗎？`
            );


        if (!confirmed) {
            return;
        }


        try {

            showStatus(
                "正在刪除資料...",
                "info"
            );


            await deleteDoc(
                doc(
                    db,
                    "recognitions",
                    id
                )
            );


            if (record.photoFileId) {

                try {

                    await deletePhoto(
                        record.photoFileId
                    );

                } catch (error) {

                    console.warn(
                        "照片刪除失敗：",
                        error
                    );

                }

            }


            showStatus(
                "資料已刪除。",
                "success"
            );


            await loadMyRecords();


        } catch (error) {

            console.error(error);

            showStatus(
                "刪除失敗：" +
                error.message,
                "error"
            );

        }

    };


/* ============================================================
   照片預覽
============================================================ */

photoInput.addEventListener(
    "change",
    () => {

        const file =
            photoInput.files[0];


        if (!file) {
            return;
        }


        const url =
            URL.createObjectURL(
                file
            );


        photoPreview.src =
            url;

        photoPreview.style.display =
            "block";

    }
);

</script>
