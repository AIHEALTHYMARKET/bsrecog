<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>BS GLOBAL｜榮耀時刻表揚</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      margin: 0;
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Noto Sans TC",
        "PingFang TC",
        "Microsoft JhengHei",
        Arial,
        sans-serif;

      background:
        radial-gradient(circle at top right, rgba(212,175,55,.10), transparent 30%),
        radial-gradient(circle at bottom left, rgba(212,175,55,.06), transparent 30%),
        #080808;

      color: #f5f5f5;
      min-height: 100vh;
    }

    .container {
      width: min(960px, calc(100% - 28px));
      margin: 0 auto;
    }

    header {
      padding: 42px 0 28px;
      text-align: center;
    }

    .brand {
      letter-spacing: 5px;
      font-size: 14px;
      color: #d4af37;
      font-weight: 700;
      margin-bottom: 12px;
    }

    h1 {
      margin: 0;
      font-size: clamp(30px, 7vw, 54px);
      letter-spacing: 4px;
      font-weight: 800;
    }

    .subtitle {
      margin-top: 10px;
      color: #aaa;
      font-size: 14px;
    }

    .card {
      background: rgba(20,20,20,.92);
      border: 1px solid rgba(212,175,55,.28);
      border-radius: 20px;
      padding: 24px;
      margin-bottom: 22px;
      box-shadow:
        0 18px 60px rgba(0,0,0,.35),
        inset 0 1px 0 rgba(255,255,255,.03);
    }

    .section-title {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 19px;
      font-weight: 800;
      margin-bottom: 20px;
    }

    .section-title::before {
      content: "";
      width: 4px;
      height: 22px;
      border-radius: 5px;
      background: #d4af37;
    }

    .login-box {
      text-align: center;
    }

    .login-email {
      color: #aaa;
      font-size: 13px;
      margin-top: 12px;
      word-break: break-all;
    }

    button {
      border: 0;
      cursor: pointer;
      font-family: inherit;
    }

    .btn {
      border-radius: 12px;
      padding: 13px 20px;
      font-size: 15px;
      font-weight: 700;
      transition: .2s;
    }

    .btn:disabled {
      opacity: .55;
      cursor: not-allowed;
    }

    .btn-gold {
      color: #111;
      background: linear-gradient(135deg, #f4d86b, #c89b2c);
      box-shadow: 0 8px 25px rgba(212,175,55,.18);
    }

    .btn-gold:hover:not(:disabled) {
      transform: translateY(-1px);
      filter: brightness(1.05);
    }

    .btn-dark {
      color: #eee;
      background: #252525;
      border: 1px solid #444;
    }

    .btn-danger {
      color: #fff;
      background: #6e2020;
      border: 1px solid #8c3434;
    }

    .btn-small {
      padding: 8px 12px;
      font-size: 13px;
      border-radius: 9px;
    }

    .form-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 18px;
    }

    .full {
      grid-column: 1 / -1;
    }

    label {
      display: block;
      color: #ddd;
      font-size: 14px;
      font-weight: 700;
      margin-bottom: 8px;
    }

    input[type="text"],
    input[type="file"],
    select {
      width: 100%;
      padding: 13px 14px;
      border-radius: 11px;
      border: 1px solid #3d3d3d;
      background: #111;
      color: #f5f5f5;
      outline: none;
      font-size: 15px;
    }

    input:focus,
    select:focus {
      border-color: #d4af37;
      box-shadow: 0 0 0 3px rgba(212,175,55,.08);
    }

    .hint {
      color: #888;
      font-size: 12px;
      margin-top: 7px;
      line-height: 1.5;
    }

    .award-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0,1fr));
      gap: 10px;
    }

    .award-item {
      position: relative;
    }

    .award-item input {
      position: absolute;
      opacity: 0;
      pointer-events: none;
    }

    .award-item label {
      display: flex;
      align-items: center;
      min-height: 48px;
      padding: 10px 13px;
      margin: 0;
      border: 1px solid #383838;
      border-radius: 10px;
      background: #111;
      color: #ccc;
      cursor: pointer;
      transition: .18s;
    }

    .award-item input:checked + label {
      border-color: #d4af37;
      background: rgba(212,175,55,.12);
      color: #f4d86b;
      box-shadow: inset 0 0 0 1px rgba(212,175,55,.18);
    }

    .photo-preview-wrap {
      display: none;
      margin-top: 14px;
      text-align: center;
    }

    .photo-preview {
      max-width: 240px;
      max-height: 280px;
      object-fit: contain;
      border-radius: 14px;
      border: 1px solid #444;
      background: #111;
    }

    .existing-photo {
      margin-top: 12px;
      color: #aaa;
      font-size: 12px;
    }

    .actions {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-top: 22px;
    }

    .message {
      display: none;
      padding: 13px 15px;
      border-radius: 11px;
      margin-bottom: 18px;
      font-size: 14px;
      line-height: 1.55;
      white-space: pre-wrap;
    }

    .message.success {
      display: block;
      background: rgba(45,130,75,.16);
      border: 1px solid rgba(75,180,105,.35);
      color: #9ee0b0;
    }

    .message.error {
      display: block;
      background: rgba(150,40,40,.16);
      border: 1px solid rgba(210,80,80,.35);
      color: #ffaaaa;
    }

    .message.info {
      display: block;
      background: rgba(50,90,140,.16);
      border: 1px solid rgba(80,140,210,.35);
      color: #a9cdf2;
    }

    .record {
      border: 1px solid #343434;
      background: #101010;
      border-radius: 14px;
      padding: 16px;
      margin-bottom: 12px;
    }

    .record-main {
      display: grid;
      grid-template-columns: 80px 1fr;
      gap: 14px;
      align-items: center;
    }

    .record-photo {
      width: 80px;
      height: 80px;
      border-radius: 12px;
      object-fit: cover;
      background: #222;
      border: 1px solid #444;
    }

    .record-name {
      font-size: 17px;
      font-weight: 800;
      color: #f3d66a;
    }

    .record-meta {
      color: #999;
      font-size: 13px;
      line-height: 1.6;
      margin-top: 4px;
    }

    .award-tags {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-top: 8px;
    }

    .tag {
      display: inline-flex;
      padding: 5px 8px;
      border-radius: 999px;
      border: 1px solid rgba(212,175,55,.35);
      background: rgba(212,175,55,.08);
      color: #e4c65b;
      font-size: 11px;
    }

    .record-actions {
      display: flex;
      gap: 8px;
      margin-top: 14px;
    }

    .empty {
      text-align: center;
      padding: 28px 10px;
      color: #777;
      border: 1px dashed #333;
      border-radius: 12px;
    }

    .loading {
      text-align: center;
      padding: 20px;
      color: #aaa;
    }

    .admin-link {
      text-align: center;
      margin: 30px 0 50px;
    }

    .admin-link a {
      color: #d4af37;
      text-decoration: none;
      font-size: 13px;
    }

    .status-dot {
      display: inline-block;
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #777;
      margin-right: 6px;
    }

    .status-dot.online {
      background: #4bd27b;
      box-shadow: 0 0 8px rgba(75,210,123,.6);
    }

    @media (max-width: 700px) {
      .form-grid {
        grid-template-columns: 1fr;
      }

      .full {
        grid-column: auto;
      }

      .award-grid {
        grid-template-columns: 1fr;
      }

      .card {
        padding: 18px;
        border-radius: 16px;
      }

      .record-main {
        grid-template-columns: 65px 1fr;
      }

      .record-photo {
        width: 65px;
        height: 65px;
      }
    }
  </style>
</head>

<body>

<div class="container">

  <header>
    <div class="brand">BS GLOBAL</div>
    <h1>榮耀時刻表揚</h1>
    <div class="subtitle">每一份突破，都值得被看見。</div>
  </header>

  <!-- LOGIN -->
  <section class="card login-box">

    <div id="loginArea">

      <div class="section-title">
        Google 登入
      </div>

      <p style="color:#aaa;font-size:14px;">
        請使用你的 Google 帳號登入後填寫表揚資料。
      </p>

      <button
        id="googleLoginBtn"
        class="btn btn-gold"
        type="button">
        使用 Google 登入
      </button>

    </div>

    <div id="userArea" style="display:none;">

      <div style="font-size:15px;font-weight:700;">
        <span class="status-dot online"></span>
        已登入
      </div>

      <div id="userEmail" class="login-email"></div>

      <div style="margin-top:15px;">
        <button
          id="logoutBtn"
          class="btn btn-dark btn-small"
          type="button">
          登出
        </button>
      </div>

    </div>

  </section>

  <div id="message" class="message"></div>

  <!-- FORM -->
  <section id="formSection" class="card" style="display:none;">

    <div class="section-title">
      <span id="formTitle">新增表揚資料</span>
    </div>

    <form id="recognitionForm">

      <div class="form-grid">

        <div>
          <label for="name">表揚者姓名 *</label>
          <input
            id="name"
            type="text"
            maxlength="100"
            required
            placeholder="請輸入姓名">
        </div>

        <div>
          <label for="occupation">表揚者職業 *</label>
          <input
            id="occupation"
            type="text"
            maxlength="100"
            required
            placeholder="請輸入職業">
        </div>

        <div>
          <label for="platinum">上線白金 *</label>

          <select id="platinum" required>
            <option value="">請選擇上線白金</option>
          </select>
        </div>

        <div>
          <label for="photo">表揚者照片 *</label>

          <input
            id="photo"
            type="file"
            accept="image/jpeg,image/jpg,image/png">

          <div class="hint">
            建議使用清晰的人像照片。系統會自動壓縮後上傳。
          </div>

          <div id="existingPhoto" class="existing-photo"></div>

          <div id="photoPreviewWrap" class="photo-preview-wrap">
            <img id="photoPreview" class="photo-preview">
          </div>
        </div>

        <div class="full">

          <label>
            突破獎銜 *
          </label>

          <div id="awardGrid" class="award-grid"></div>

          <div class="hint">
            可選擇多個突破獎銜。
          </div>

        </div>

      </div>

      <div class="actions">

        <button
          id="submitBtn"
          type="submit"
          class="btn btn-gold">
          提交表揚資料
        </button>

        <button
          id="cancelEditBtn"
          type="button"
          class="btn btn-dark"
          style="display:none;">
          取消修改
        </button>

      </div>

    </form>

  </section>

  <!-- RECORDS -->
  <section id="recordsSection" class="card" style="display:none;">

    <div class="section-title">
      我的表揚資料
    </div>

    <div id="recordsLoading" class="loading">
      正在讀取資料……
    </div>

    <div id="recordsList"></div>

  </section>

  <div class="admin-link">
    <a href="admin.html">
      管理員後台
    </a>
  </div>

</div>


<!-- IMPORTANT: hidden iframe for Apps Script -->
<iframe
  id="gasFrame"
  name="gasFrame"
  style="display:none;width:0;height:0;border:0;">
</iframe>


<script type="module">

/* =========================================================
   FIREBASE
========================================================= */

import {
  initializeApp
} from "https://www.gstatic.com/firebasejs/12.2.1/firebase-app.js";

import {
  getAuth,
  GoogleAuthProvider,
  signInWithPopup,
  signOut,
  onAuthStateChanged
} from "https://www.gstatic.com/firebasejs/12.2.1/firebase-auth.js";

import {
  getFirestore,
  collection,
  doc,
  getDoc,
  setDoc,
  updateDoc,
  deleteDoc,
  getDocs,
  query,
  where,
  serverTimestamp
} from "https://www.gstatic.com/firebasejs/12.2.1/firebase-firestore.js";


/* =========================================================
   FIREBASE CONFIG
========================================================= */

const firebaseConfig = {

  apiKey:
    "AIzaSyDpWeR78Lwfi9mDOS4mCzUsTYVI7SOsDVY",

  authDomain:
    "bsrecog.firebaseapp.com",

  projectId:
    "bsrecog",

  storageBucket:
    "bsrecog.firebasestorage.app",

  messagingSenderId:
    "104751827465",

  appId:
    "1:104751827465:web:ee5e360dedbd4a70b246d8",

  measurementId:
    "G-JEPWHQ6FQ9"
};


/* =========================================================
   APPS SCRIPT
========================================================= */

/*
  ⚠️ 這裡必須是你目前 Apps Script 部署後的 /exec URL。

  如果你之前的 Apps Script URL 沒有改變，
  就保持原本 URL。

  如果你重新建立了 Apps Script Web App，
  把下面這一行換成新的 /exec URL。
*/

const APPS_SCRIPT_URL =
  "https://script.google.com/macros/s/AKfycbycfMlsXP84tZxRB22oDpoAEStBqvi_dt3zhVsEzNJ9YKL75XEKIca-ZEl8weMl_iqe/exec";


const ADMIN_EMAIL =
  "diabolo.weien@gmail.com";


/* =========================================================
   DEFAULT SETTINGS
========================================================= */

const DEFAULT_PLATINUM_LIST = [

  "Sense&Lavenier",
  "Amos",
  "Sunny",
  "Robin&Zoey",
  "RyanLio",
  "Wyane&Momo",
  "Jess",
  "SzeChew",
  "Lynn",
  "Keong&Ngah"

];


const DEFAULT_AWARD_LIST = [

  "Silver Inner Circle",
  "Gold Inner Circle",
  "100% User",
  "100ppv",
  "3%",
  "300ppv",
  "600ppv",
  "6%",
  "1000ppv",
  "9%",
  "12%",
  "Bronze Foundation",
  "15%",
  "18%",
  "Bronze Builder",
  "Core",
  "Super core",
  "Silver producer",
  "Gold producer",
  "Platinum",
  "Founder Platinum"

];


/* =========================================================
   INIT
========================================================= */

const app =
  initializeApp(firebaseConfig);

const auth =
  getAuth(app);

const db =
  getFirestore(app);

const provider =
  new GoogleAuthProvider();

provider.setCustomParameters({
  prompt: "select_account"
});


/* =========================================================
   DOM
========================================================= */

const googleLoginBtn =
  document.getElementById("googleLoginBtn");

const logoutBtn =
  document.getElementById("logoutBtn");

const loginArea =
  document.getElementById("loginArea");

const userArea =
  document.getElementById("userArea");

const userEmail =
  document.getElementById("userEmail");

const formSection =
  document.getElementById("formSection");

const recordsSection =
  document.getElementById("recordsSection");

const form =
  document.getElementById("recognitionForm");

const formTitle =
  document.getElementById("formTitle");

const nameInput =
  document.getElementById("name");

const occupationInput =
  document.getElementById("occupation");

const platinumSelect =
  document.getElementById("platinum");

const photoInput =
  document.getElementById("photo");

const photoPreviewWrap =
  document.getElementById("photoPreviewWrap");

const photoPreview =
  document.getElementById("photoPreview");

const existingPhoto =
  document.getElementById("existingPhoto");

const awardGrid =
  document.getElementById("awardGrid");

const submitBtn =
  document.getElementById("submitBtn");

const cancelEditBtn =
  document.getElementById("cancelEditBtn");

const recordsLoading =
  document.getElementById("recordsLoading");

const recordsList =
  document.getElementById("recordsList");

const messageBox =
  document.getElementById("message");


/* =========================================================
   STATE
========================================================= */

let currentUser = null;

let currentSettings = {
  platinumList: [...DEFAULT_PLATINUM_LIST],
  awardList: [...DEFAULT_AWARD_LIST]
};

let editingRecordId = null;

let editingRecord = null;

let loginInProgress = false;

let submitInProgress = false;


/* =========================================================
   MESSAGE
========================================================= */

function showMessage(
  text,
  type = "info"
) {

  messageBox.textContent = text;

  messageBox.className =
    "message " + type;

  window.scrollTo({
    top: 0,
    behavior: "smooth"
  });
}


function clearMessage() {

  messageBox.textContent = "";

  messageBox.className =
    "message";

}


/* =========================================================
   LOGIN
========================================================= */

googleLoginBtn.addEventListener(
  "click",
  async () => {

    if (loginInProgress) {
      return;
    }

    loginInProgress = true;

    googleLoginBtn.disabled = true;

    clearMessage();

    try {

      await signInWithPopup(
        auth,
        provider
      );

    } catch (error) {

      console.error(
        "Google login error:",
        error
      );

      let msg =
        error?.message ||
        "Google 登入失敗";

      if (
        error?.code ===
        "auth/popup-closed-by-user"
      ) {
        msg =
          "登入視窗已關閉。";
      }

      if (
        error?.code ===
        "auth/cancelled-popup-request"
      ) {
        msg =
          "登入視窗重複開啟，請稍候再試。";
      }

      showMessage(
        "登入失敗：\n" + msg,
        "error"
      );

    } finally {

      loginInProgress = false;

      googleLoginBtn.disabled = false;

    }

  }
);


/* =========================================================
   LOGOUT
========================================================= */

logoutBtn.addEventListener(
  "click",
  async () => {

    try {

      await signOut(auth);

      resetForm();

      showMessage(
        "已登出。",
        "success"
      );

    } catch (error) {

      console.error(error);

      showMessage(
        "登出失敗：\n" +
        (error.message || error),
        "error"
      );

    }

  }
);


/* =========================================================
   AUTH STATE
========================================================= */

onAuthStateChanged(
  auth,
  async user => {

    currentUser = user || null;

    if (!user) {

      loginArea.style.display =
        "block";

      userArea.style.display =
        "none";

      formSection.style.display =
        "none";

      recordsSection.style.display =
        "none";

      return;
    }


    loginArea.style.display =
      "none";

    userArea.style.display =
      "block";

    formSection.style.display =
      "block";

    recordsSection.style.display =
      "block";

    userEmail.textContent =
      user.email || "";


    clearMessage();


    try {

      await loadSettings();

      renderSettings();

      await loadMyRecords();

    } catch (error) {

      console.error(
        "Initial loading error:",
        error
      );

      showMessage(
        "資料載入失敗：\n" +
        getFriendlyError(error),
        "error"
      );

    }

  }
);


/* =========================================================
   SETTINGS
========================================================= */

async function loadSettings() {

  try {

    const ref =
      doc(
        db,
        "settings",
        "config"
      );

    const snap =
      await getDoc(ref);

    if (snap.exists()) {

      const data =
        snap.data();

      currentSettings = {

        platinumList:
          Array.isArray(data.platinumList)
            ? data.platinumList
            : [...DEFAULT_PLATINUM_LIST],

        awardList:
          Array.isArray(data.awardList)
            ? data.awardList
            : [...DEFAULT_AWARD_LIST]

      };

    } else {

      /*
        普通會員不建立 settings。
        如果不存在就使用預設值。
      */

      currentSettings = {

        platinumList:
          [...DEFAULT_PLATINUM_LIST],

        awardList:
          [...DEFAULT_AWARD_LIST]

      };

    }

  } catch (error) {

    /*
      如果 settings 沒有讀取權限，
      不要讓整個頁面死亡。
      直接使用預設設定。
    */

    console.warn(
      "Settings loading failed:",
      error
    );

    currentSettings = {

      platinumList:
        [...DEFAULT_PLATINUM_LIST],

      awardList:
        [...DEFAULT_AWARD_LIST]

    };

  }

}


/* =========================================================
   RENDER SETTINGS
========================================================= */

function renderSettings() {

  platinumSelect.innerHTML =
    '<option value="">請選擇上線白金</option>';

  currentSettings.platinumList
    .forEach(item => {

      const option =
        document.createElement(
          "option"
        );

      option.value = item;

      option.textContent = item;

      platinumSelect.appendChild(
        option
      );

    });


  awardGrid.innerHTML = "";


  currentSettings.awardList
    .forEach((award, index) => {

      const id =
        "award_" + index;


      const wrapper =
        document.createElement("div");

      wrapper.className =
        "award-item";


      const input =
        document.createElement("input");

      input.type = "checkbox";

      input.id = id;

      input.name = "awards";

      input.value = award;


      const label =
        document.createElement("label");

      label.htmlFor = id;

      label.textContent = award;


      wrapper.appendChild(input);

      wrapper.appendChild(label);

      awardGrid.appendChild(wrapper);

    });

}


/* =========================================================
   PHOTO PREVIEW
========================================================= */

photoInput.addEventListener(
  "change",
  async () => {

    const file =
      photoInput.files?.[0];

    if (!file) {

      photoPreviewWrap.style.display =
        "none";

      return;
    }


    if (
      ![
        "image/jpeg",
        "image/jpg",
        "image/png"
      ].includes(file.type)
    ) {

      photoInput.value = "";

      showMessage(
        "照片只接受 JPG / JPEG / PNG。",
        "error"
      );

      return;
    }


    try {

      const compressed =
        await compressImage(file);

      photoPreview.src =
        compressed.dataUrl;

      photoPreviewWrap.style.display =
        "block";

    } catch (error) {

      console.error(error);

      showMessage(
        "照片預覽失敗：\n" +
        error.message,
        "error"
      );

    }

  }
);


/* =========================================================
   IMAGE COMPRESS
========================================================= */

function compressImage(
  file
) {

  return new Promise(
    (resolve, reject) => {

      const reader =
        new FileReader();

      reader.onload =
        event => {

          const img =
            new Image();

          img.onload =
            () => {

              const MAX_SIZE =
                1600;

              let width =
                img.width;

              let height =
                img.height;


              if (
                width > MAX_SIZE ||
                height > MAX_SIZE
              ) {

                if (
                  width > height
                ) {

                  height =
                    Math.round(
                      height *
                      MAX_SIZE /
                      width
                    );

                  width =
                    MAX_SIZE;

                } else {

                  width =
                    Math.round(
                      width *
                      MAX_SIZE /
                      height
                    );

                  height =
                    MAX_SIZE;

                }

              }


              const canvas =
                document.createElement(
                  "canvas"
                );

              canvas.width =
                width;

              canvas.height =
                height;


              const ctx =
                canvas.getContext(
                  "2d"
                );

              ctx.drawImage(
                img,
                0,
                0,
                width,
                height
              );


              const dataUrl =
                canvas.toDataURL(
                  "image/jpeg",
                  0.84
                );


              resolve({

                dataUrl,

                fileName:
                  file.name
                    .replace(
                      /\.[^/.]+$/,
                      ""
                    ) +
                  ".jpg"

              });

            };


          img.onerror =
            () => reject(
              new Error(
                "無法讀取圖片"
              )
            );


          img.src =
            event.target.result;

        };


      reader.onerror =
        () => reject(
          new Error(
            "圖片讀取失敗"
          )
        );


      reader.readAsDataURL(file);

    }
  );

}


/* =========================================================
   GET SELECTED AWARDS
========================================================= */

function getSelectedAwards() {

  return [
    ...document.querySelectorAll(
      'input[name="awards"]:checked'
    )
  ].map(
    input => input.value
  );

}


/* =========================================================
   FORM SUBMIT
========================================================= */

form.addEventListener(
  "submit",
  async event => {

    event.preventDefault();


    if (!currentUser) {

      showMessage(
        "請先使用 Google 登入。",
        "error"
      );

      return;
    }


    if (submitInProgress) {
      return;
    }


    const name =
      nameInput.value.trim();

    const occupation =
      occupationInput.value.trim();

    const platinum =
      platinumSelect.value;

    const awards =
      getSelectedAwards();


    if (!name) {

      showMessage(
        "請輸入表揚者姓名。",
        "error"
      );

      return;
    }


    if (!occupation) {

      showMessage(
        "請輸入表揚者職業。",
        "error"
      );

      return;
    }


    if (!platinum) {

      showMessage(
        "請選擇上線白金。",
        "error"
      );

      return;
    }


    if (!awards.length) {

      showMessage(
        "請至少選擇一個突破獎銜。",
        "error"
      );

      return;
    }


    /*
      新增時必須有照片。
      編輯時可以沿用舊照片。
    */

    const newPhoto =
      photoInput.files?.[0];


    if (
      !editingRecordId &&
      !newPhoto
    ) {

      showMessage(
        "請選擇表揚者照片。",
        "error"
      );

      return;
    }


    submitInProgress = true;

    submitBtn.disabled = true;

    cancelEditBtn.disabled = true;


    try {

      clearMessage();


      showMessage(
        editingRecordId
          ? "正在更新表揚資料，請稍候……"
          : "正在提交表揚資料，請稍候……",
        "info"
      );


      /*
        -----------------------------------------------------
        STEP 1
        如果有新照片，先上傳 Drive
        -----------------------------------------------------
      */

      let photoInfo = null;

      let uploadedNewPhotoId = null;


      if (newPhoto) {

        showMessage(
          "正在處理照片……",
          "info"
        );


        const compressed =
          await compressImage(
            newPhoto
          );


        /*
          Base64 太大會讓 Apps Script
          Web App 很容易失敗。

          這裡會控制圖片大小。
        */

        const base64 =
          compressed.dataUrl;


        photoInfo =
          await postToAppsScript({

            action:
              "uploadPhoto",

            idToken:
              await currentUser.getIdToken(
                true
              ),

            fileName:
              compressed.fileName,

            mimeType:
              "image/jpeg",

            base64:
              base64

          });


        uploadedNewPhotoId =
          photoInfo.fileId;


        if (
          !photoInfo ||
          !photoInfo.fileId
        ) {

          throw new Error(
            "Google Drive 沒有回傳照片 fileId。"
          );

        }

      }


      /*
        -----------------------------------------------------
        STEP 2
        建立 Firestore 資料
        -----------------------------------------------------
      */

      showMessage(
        "照片已處理，正在寫入表揚資料……",
        "info"
      );


      const now =
        serverTimestamp();


      if (!editingRecordId) {

        /*
          新增
        */

        const newDocRef =
          doc(
            collection(
              db,
              "recognitions"
            )
          );


        const data = {

          uid:
            currentUser.uid,

          email:
            currentUser.email,

          name:
            name,

          occupation:
            occupation,

          platinum:
            platinum,

          awards:
            awards,

          photoFileId:
            photoInfo.fileId,

          photoFileName:
            photoInfo.fileName || "",

          photoDriveUrl:
            photoInfo.driveUrl || "",

          createdAt:
            now,

          updatedAt:
            now

        };


        /*
          這裡使用 setDoc，
          文件 ID 是我們自己建立的，
          Rules 可以正常驗證。
        */

        await setDoc(
          newDocRef,
          data
        );


      } else {

        /*
          編輯
        */

        const oldPhotoId =
          editingRecord?.photoFileId || "";


        const updateData = {

          uid:
            currentUser.uid,

          email:
            currentUser.email,

          name:
            name,

          occupation:
            occupation,

          platinum:
            platinum,

          awards:
            awards,

          updatedAt:
            now

        };


        /*
          如果換了照片，
          Firestore 改成新照片。
        */

        if (photoInfo) {

          updateData.photoFileId =
            photoInfo.fileId;

          updateData.photoFileName =
            photoInfo.fileName || "";

          updateData.photoDriveUrl =
            photoInfo.driveUrl || "";

        }


        const recordRef =
          doc(
            db,
            "recognitions",
            editingRecordId
          );


        await updateDoc(
          recordRef,
          updateData
        );


        /*
          Firestore 成功後，
          才刪除舊照片。
        */

        if (
          photoInfo &&
          oldPhotoId &&
          oldPhotoId !== photoInfo.fileId
        ) {

          try {

            await postToAppsScript({

              action:
                "deletePhoto",

              idToken:
                await currentUser.getIdToken(
                  true
                ),

              fileId:
                oldPhotoId

            });

          } catch (deleteError) {

            /*
              舊照片刪除失敗，
              不影響新的表揚資料。
            */

            console.warn(
              "舊照片刪除失敗:",
              deleteError
            );

          }

        }

      }


      /*
        -----------------------------------------------------
        STEP 3
        成功
        -----------------------------------------------------
      */

      showMessage(
        editingRecordId
          ? "表揚資料更新成功！"
          : "表揚資料提交成功！",
        "success"
      );


      resetForm();


      await loadMyRecords();


    } catch (error) {

      console.error(
        "SUBMIT ERROR:",
        error
      );


      /*
        如果照片已經上傳，
        但 Firestore 失敗，
        把剛剛上傳的新照片移到垃圾桶。
      */

      if (
        uploadedNewPhotoId &&
        !editingRecordId
      ) {

        try {

          await postToAppsScript({

            action:
              "deletePhoto",

            idToken:
              await currentUser.getIdToken(
                true
              ),

            fileId:
              uploadedNewPhotoId

          });

        } catch (cleanupError) {

          console.warn(
            "清理失敗的照片失敗:",
            cleanupError
          );

        }

      }


      showMessage(
        "提交失敗：\n" +
        getFriendlyError(error),
        "error"
      );

    } finally {

      submitInProgress =
        false;

      submitBtn.disabled =
        false;

      cancelEditBtn.disabled =
        false;

    }

  }
);


/* =========================================================
   FRIENDLY FIREBASE ERROR
========================================================= */

function getFriendlyError(
  error
) {

  const code =
    error?.code || "";

  const message =
    error?.message ||
    String(error);


  if (
    code ===
    "permission-denied"
  ) {

    return (
      "Firestore 權限被拒絕。\n\n" +
      "請確認 Firebase Firestore Rules 已經使用本頁提供的最新版本。\n\n" +
      "原始錯誤：\n" +
      message
    );

  }


  if (
    message.includes(
      "Missing or insufficient permissions"
    )
  ) {

    return (
      "Firestore 權限被拒絕。\n\n" +
      "請確認 Firebase Firestore Rules 已經更新並 Publish。\n\n" +
      "原始錯誤：\n" +
      message
    );

  }


  if (
    message.includes(
      "Google Drive 服務逾時"
    )
  ) {

    return (
      "Google Drive 沒有在指定時間內回覆。\n\n" +
      "如果 Google Drive 已經出現照片，代表照片可能已成功建立。\n\n" +
      message
    );

  }


  return message;

}


/* =========================================================
   LOAD MY RECORDS
========================================================= */

async function loadMyRecords() {

  recordsLoading.style.display =
    "block";

  recordsList.innerHTML =
    "";


  if (!currentUser) {

    recordsLoading.textContent =
      "請先登入。";

    return;

  }


  try {

    /*
      最重要的修改：

      不使用 orderBy，
      不需要建立 Firestore index。

      只使用 uid == currentUser.uid。
    */

    const q =
      query(
        collection(
          db,
          "recognitions"
        ),
        where(
          "uid",
          "==",
          currentUser.uid
        )
      );


    const snapshot =
      await getDocs(q);


    const records =
      [];


    snapshot.forEach(
      docSnap => {

        records.push({

          id:
            docSnap.id,

          ...docSnap.data()

        });

      }
    );


    /*
      client-side 排序
    */

    records.sort(
      (a, b) => {

        const aTime =
          getTimestampValue(
            a.createdAt
          );

        const bTime =
          getTimestampValue(
            b.createdAt
          );

        return bTime - aTime;

      }
    );


    recordsLoading.style.display =
      "none";


    if (!records.length) {

      recordsList.innerHTML = `
        <div class="empty">
          目前還沒有表揚資料。
        </div>
      `;

      return;

    }


    records.forEach(
      record => {

        recordsList.appendChild(
          createRecordElement(
            record
          )
        );

      }
    );


  } catch (error) {

    console.error(
      "LOAD RECORDS ERROR:",
      error
    );


    recordsLoading.style.display =
      "none";


    recordsList.innerHTML = `
      <div class="message error" style="display:block;">
        無法讀取資料。<br><br>
        ${escapeHtml(
          getFriendlyError(error)
        )}
      </div>
    `;

  }

}


/* =========================================================
   TIMESTAMP
========================================================= */

function getTimestampValue(
  value
) {

  if (!value) {
    return 0;
  }


  if (
    typeof value.toMillis ===
    "function"
  ) {

    return value.toMillis();

  }


  if (
    value.seconds !== undefined
  ) {

    return (
      Number(value.seconds) *
      1000
    );

  }


  return 0;

}


/* =========================================================
   CREATE RECORD ELEMENT
========================================================= */

function createRecordElement(
  record
) {

  const wrapper =
    document.createElement(
      "div"
    );

  wrapper.className =
    "record";


  const main =
    document.createElement(
      "div"
    );

  main.className =
    "record-main";


  const img =
    document.createElement(
      "img"
    );

  img.className =
    "record-photo";


  if (record.photoDriveUrl) {

    img.src =
      record.photoDriveUrl;

  } else {

    img.style.display =
      "none";

  }


  const content =
    document.createElement(
      "div"
    );


  const name =
    document.createElement(
      "div"
    );

  name.className =
    "record-name";

  name.textContent =
    record.name || "";


  const meta =
    document.createElement(
      "div"
    );

  meta.className =
    "record-meta";

  meta.textContent =
    [
      record.occupation || "",
      "上線白金：" +
      (record.platinum || "")
    ]
      .filter(Boolean)
      .join(" ｜ ");


  const tags =
    document.createElement(
      "div"
    );

  tags.className =
    "award-tags";


  (
    Array.isArray(record.awards)
      ? record.awards
      : []
  ).forEach(
    award => {

      const tag =
        document.createElement(
          "span"
        );

      tag.className =
        "tag";

      tag.textContent =
        award;

      tags.appendChild(
        tag
      );

    }
  );


  content.appendChild(name);

  content.appendChild(meta);

  content.appendChild(tags);


  main.appendChild(img);

  main.appendChild(content);


  const actions =
    document.createElement(
      "div"
    );

  actions.className =
    "record-actions";


  const editBtn =
    document.createElement(
      "button"
    );

  editBtn.type =
    "button";

  editBtn.className =
    "btn btn-dark btn-small";

  editBtn.textContent =
    "修改";


  editBtn.addEventListener(
    "click",
    () => {

      startEdit(record);

    }
  );


  const deleteBtn =
    document.createElement(
      "button"
    );

  deleteBtn.type =
    "button";

  deleteBtn.className =
    "btn btn-danger btn-small";

  deleteBtn.textContent =
    "刪除";


  deleteBtn.addEventListener(
    "click",
    () => {

      deleteRecord(
        record
      );

    }
  );


  actions.appendChild(
    editBtn
  );

  actions.appendChild(
    deleteBtn
  );


  wrapper.appendChild(
    main
  );

  wrapper.appendChild(
    actions
  );


  return wrapper;

}


/* =========================================================
   START EDIT
========================================================= */

function startEdit(
  record
) {

  editingRecordId =
    record.id;

  editingRecord =
    record;


  formTitle.textContent =
    "修改表揚資料";


  nameInput.value =
    record.name || "";


  occupationInput.value =
    record.occupation || "";


  platinumSelect.value =
    record.platinum || "";


  document
    .querySelectorAll(
      'input[name="awards"]'
    )
    .forEach(
      input => {

        input.checked =
          Array.isArray(
            record.awards
          ) &&
          record.awards.includes(
            input.value
          );

      }
    );


  photoInput.value =
    "";


  if (record.photoDriveUrl) {

    existingPhoto.innerHTML =
      "目前照片已儲存在 Google Drive。<br>" +
      "如果不選新照片，會繼續使用目前照片。";

  } else {

    existingPhoto.textContent =
      "";

  }


  photoPreviewWrap.style.display =
    "none";


  submitBtn.textContent =
    "儲存修改";


  cancelEditBtn.style.display =
    "inline-block";


  formSection.scrollIntoView({
    behavior: "smooth"
  });

}


/* =========================================================
   CANCEL EDIT
========================================================= */

cancelEditBtn.addEventListener(
  "click",
  () => {

    resetForm();

    clearMessage();

  }
);


/* =========================================================
   RESET FORM
========================================================= */

function resetForm() {

  editingRecordId =
    null;

  editingRecord =
    null;


  form.reset();


  formTitle.textContent =
    "新增表揚資料";


  submitBtn.textContent =
    "提交表揚資料";


  cancelEditBtn.style.display =
    "none";


  existingPhoto.textContent =
    "";


  photoPreviewWrap.style.display =
    "none";

}


/* =========================================================
   DELETE RECORD
========================================================= */

async function deleteRecord(
  record
) {

  if (!currentUser) {
    return;
  }


  const confirmed =
    confirm(
      `確定要刪除「${record.name || ""}」的表揚資料嗎？\n\n此操作無法復原。`
    );


  if (!confirmed) {
    return;
  }


  try {

    showMessage(
      "正在刪除資料……",
      "info"
    );


    /*
      先刪 Firestore。
    */

    await deleteDoc(
      doc(
        db,
        "recognitions",
        record.id
      )
    );


    /*
      Firestore 成功後，
      再刪 Drive 照片。
    */

    if (record.photoFileId) {

      try {

        await postToAppsScript({

          action:
            "deletePhoto",

          idToken:
            await currentUser.getIdToken(
              true
            ),

          fileId:
            record.photoFileId

        });

      } catch (driveError) {

        console.warn(
          "Drive photo delete failed:",
          driveError
        );

      }

    }


    showMessage(
      "表揚資料已刪除。",
      "success"
    );


    await loadMyRecords();


  } catch (error) {

    console.error(error);

    showMessage(
      "刪除失敗：\n" +
      getFriendlyError(error),
      "error"
    );

  }

}


/* =========================================================
   APPS SCRIPT POST
========================================================= */

function postToAppsScript(
  data
) {

  return new Promise(
    (resolve, reject) => {

      const iframe =
        document.getElementById(
          "gasFrame"
        );


      if (!iframe) {

        reject(
          new Error(
            "找不到 Google Apps Script iframe。"
          )
        );

        return;

      }


      if (
        !APPS_SCRIPT_URL ||
        APPS_SCRIPT_URL.includes(
          "xxxxxxxx"
        )
      ) {

        reject(
          new Error(
            "APPS_SCRIPT_URL 尚未設定成真正的 Apps Script /exec URL。"
          )
        );

        return;

      }


      const form =
        document.createElement(
          "form"
        );


      form.method =
        "POST";

      form.action =
        APPS_SCRIPT_URL;

      form.target =
        "gasFrame";

      form.style.display =
        "none";


      Object.keys(data)
        .forEach(
          key => {

            const input =
              document.createElement(
                "input"
              );

            input.type =
              "hidden";

            input.name =
              key;

            input.value =
              data[key] ?? "";

            form.appendChild(
              input
            );

          }
        );


      document.body.appendChild(
        form
      );


      let finished =
        false;


      /*
        這裡提高到 5 分鐘。
        不再使用原本 60 / 120 秒。
      */

      const timeout =
        setTimeout(
          () => {

            if (finished) {
              return;
            }

            finished = true;

            cleanup();

            reject(
              new Error(
                "Google Drive 服務逾時，請稍後再試。"
              )
            );

          },
          300000
        );


      function cleanup() {

        clearTimeout(
          timeout
        );

        window.removeEventListener(
          "message",
          messageHandler
        );

        try {

          form.remove();

        } catch (e) {}

      }


      function messageHandler(
        event
      ) {

        const result =
          event.data;


        if (
          !result ||
          typeof result !== "object"
        ) {

          return;

        }


        /*
          Apps Script 回應只接受我們的 action。
        */

        if (
          result.action !==
            "uploadPhoto" &&
          result.action !==
            "deletePhoto" &&
          result.action !==
            "generatePpt"
        ) {

          return;

        }


        if (finished) {
          return;
        }


        finished = true;

        cleanup();


        if (
          result.success
        ) {

          resolve(
            result.result
          );

        } else {

          reject(
            new Error(
              result.error ||
              "Google Apps Script 執行失敗"
            )
          );

        }

      }


      window.addEventListener(
        "message",
        messageHandler
      );


      try {

        form.submit();

      } catch (error) {

        if (!finished) {

          finished = true;

          cleanup();

          reject(
            error
          );

        }

      }

    }
  );

}


/* =========================================================
   ESCAPE HTML
========================================================= */

function escapeHtml(
  value
) {

  return String(value)
    .replace(
      /&/g,
      "&amp;"
    )
    .replace(
      /</g,
      "&lt;"
    )
    .replace(
      />/g,
      "&gt;"
    )
    .replace(
      /"/g,
      "&quot;"
    )
    .replace(
      /'/g,
      "&#039;"
    );

}
