<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>BS GLOBAL｜榮耀時刻表揚</title>

<style>

*{ box-sizing:border-box; }

body{
  margin:0;
  background:#080808;
  color:#f5f5f5;
  font-family:-apple-system,BlinkMacSystemFont,"Noto Sans TC","PingFang TC","Microsoft JhengHei",Arial,sans-serif;
}

.container{ width:min(960px,calc(100% - 28px)); margin:auto; }

header{ text-align:center; padding:42px 0 28px; }

.brand{ color:#d4af37; letter-spacing:5px; font-size:14px; font-weight:700; margin-bottom:12px; }

h1{ margin:0; font-size:clamp(30px,7vw,54px); letter-spacing:4px; }

.subtitle{ margin-top:10px; color:#999; font-size:14px; }

.card{
  background:#141414;
  border:1px solid rgba(212,175,55,.28);
  border-radius:20px;
  padding:24px;
  margin-bottom:22px;
  box-shadow:0 18px 60px rgba(0,0,0,.35);
}

.section-title{
  display:flex; align-items:center; gap:10px;
  font-size:19px; font-weight:800; margin-bottom:20px;
}

.section-title:before{
  content:""; width:4px; height:22px; border-radius:5px; background:#d4af37;
}

.form-grid{ display:grid; grid-template-columns:1fr 1fr; gap:18px; }

.full{ grid-column:1/-1; }

label{ display:block; color:#ddd; font-size:14px; font-weight:700; margin-bottom:8px; }

input[type=text],
input[type=file],
select{
  width:100%; padding:13px 14px; border-radius:11px;
  border:1px solid #3d3d3d; background:#111; color:#fff;
  font-size:15px; outline:none;
}

input:focus,
select:focus{ border-color:#d4af37; }

.btn{
  border:0; border-radius:12px; padding:13px 20px;
  font-size:15px; font-weight:700; cursor:pointer;
}

.btn:disabled{ opacity:.5; cursor:not-allowed; }

.btn-gold{ color:#111; background:linear-gradient(135deg,#f4d86b,#c89b2c); }

.btn-dark{ color:#eee; background:#252525; border:1px solid #444; }

.btn-danger{ color:#fff; background:#6e2020; }

.btn-small{ padding:8px 12px; font-size:13px; }

.award-grid{ display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:10px; }

.award-item{ position:relative; }

.award-item input{ position:absolute; opacity:0; }

.award-item label{
  display:flex; align-items:center; min-height:48px;
  padding:10px 13px; margin:0;
  border:1px solid #383838; border-radius:10px;
  background:#111; color:#ccc; cursor:pointer;
}

.award-item input:checked+label{
  border-color:#d4af37; background:rgba(212,175,55,.12); color:#f4d86b;
}

.hint{ color:#888; font-size:12px; margin-top:7px; line-height:1.5; }

.actions{ display:flex; flex-wrap:wrap; gap:10px; margin-top:22px; }

.message{
  display:none; padding:14px 16px; border-radius:11px;
  margin-bottom:18px; font-size:14px; line-height:1.6; white-space:pre-wrap;
}

.message.success{
  display:block; background:rgba(45,130,75,.16);
  border:1px solid rgba(75,180,105,.35); color:#9ee0b0;
}

.message.error{
  display:block; background:rgba(150,40,40,.16);
  border:1px solid rgba(210,80,80,.35); color:#ffaaaa;
}

.message.info{
  display:block; background:rgba(50,90,140,.16);
  border:1px solid rgba(80,140,210,.35); color:#a9cdf2;
}

/* 場次提示 */

.event-banner{
  padding:12px 14px; border-radius:11px; margin-bottom:18px;
  font-size:14px; line-height:1.6; font-weight:700;
}

.event-banner.ok{
  background:rgba(212,175,55,.10);
  border:1px solid rgba(212,175,55,.35);
  color:#f4d86b;
}

.event-banner.warn{
  background:rgba(150,40,40,.16);
  border:1px solid rgba(210,80,80,.35);
  color:#ffaaaa;
}

/* 場次分頁 */

.event-tabs{
  display:flex; flex-wrap:wrap; gap:8px; margin-bottom:16px;
}

.event-tab{
  border:1px solid #3a3a3a; background:#111; color:#bbb;
  border-radius:999px; padding:9px 14px;
  font-size:13px; font-weight:700; cursor:pointer;
}

.event-tab.active{
  border-color:#d4af37; background:rgba(212,175,55,.14); color:#f4d86b;
}

.record{
  border:1px solid #343434; background:#101010;
  border-radius:14px; padding:16px; margin-bottom:12px;
}

.record-main{
  display:grid; grid-template-columns:80px 1fr; gap:14px; align-items:center;
}

.record-photo{
  width:80px; height:80px; border-radius:12px;
  object-fit:cover; background:#222;
}

.record-name{ font-size:17px; font-weight:800; color:#f3d66a; }

.record-meta{ color:#999; font-size:13px; line-height:1.6; margin-top:4px; }

.award-tags{ display:flex; flex-wrap:wrap; gap:6px; margin-top:8px; }

.tag{
  padding:5px 8px; border-radius:999px;
  border:1px solid rgba(212,175,55,.35);
  background:rgba(212,175,55,.08);
  color:#e4c65b; font-size:11px;
}

.record-actions{ display:flex; gap:8px; margin-top:14px; }

.record-locked{
  margin-top:14px; color:#888; font-size:12px;
}

.empty{
  text-align:center; padding:28px 10px; color:#777;
  border:1px dashed #333; border-radius:12px;
}

.loading{ text-align:center; padding:20px; color:#aaa; }

.preview{ display:none; margin-top:12px; text-align:center; }

.preview img{ max-width:240px; max-height:320px; border-radius:14px; }

.admin-link{ text-align:center; margin:30px 0 50px; }

.admin-link a{ color:#d4af37; text-decoration:none; }

@media(max-width:700px){

  .form-grid{ grid-template-columns:1fr; }

  .full{ grid-column:auto; }

  .award-grid{ grid-template-columns:1fr; }

  .card{ padding:18px; }

  .record-main{ grid-template-columns:65px 1fr; }

  .record-photo{ width:65px; height:65px; }

}

</style>
</head>

<body>

<div class="container">

<header>
  <div class="brand">BS GLOBAL</div>
  <h1>榮耀時刻表揚</h1>
  <div class="subtitle">每一份突破，都值得被看見。</div>
</header>


<!-- LOGIN -->

<section class="card">

  <div id="loginArea" style="text-align:center;">

    <div class="section-title">
      Google 登入
    </div>

    <p style="color:#aaa;font-size:14px;">
      請使用 Google 帳號登入。
    </p>

    <button
      id="googleLoginBtn"
      class="btn btn-gold"
      type="button">
      使用 Google 登入
    </button>

  </div>


  <div id="userArea"
       style="display:none;text-align:center;">

    <div style="font-weight:700;">
      ● 已登入
    </div>

    <div
      id="userEmail"
      style="color:#aaa;font-size:13px;margin-top:8px;">
    </div>

    <button
      id="logoutBtn"
      class="btn btn-dark btn-small"
      style="margin-top:12px;"
      type="button">
      登出
    </button>

  </div>

</section>


<div id="message"
     class="message">
</div>


<!-- FORM -->

<section
  id="formSection"
  class="card"
  style="display:none;">

  <div class="section-title">
    <span id="formTitle">
      新增表揚資料
    </span>
  </div>

  <div
    id="eventBanner"
    class="event-banner ok">
  </div>


  <form id="recognitionForm">

    <div class="form-grid">


      <div>

        <label>
          表揚者姓名 *
        </label>

        <input
          id="name"
          type="text"
          maxlength="100"
          required
          placeholder="請輸入姓名">

      </div>


      <div>

        <label>
          表揚者職業 *
        </label>

        <input
          id="occupation"
          type="text"
          maxlength="100"
          required
          placeholder="請輸入職業">

      </div>


      <div>

        <label>
          上線白金 *
        </label>

        <select
          id="platinum"
          required>

          <option value="">
            請選擇上線白金
          </option>

        </select>

      </div>


      <div>

        <label>
          表揚者照片（選填）
        </label>

        <input
          id="photo"
          type="file"
          accept="image/jpeg,image/jpg,image/png">

        <div class="hint">
          選填。JPG / JPEG / PNG。
          系統會自動置中裁切成直向 3:4 並壓縮。
          沒有上傳照片時，簡報會使用預設照片。
        </div>

        <div
          id="existingPhoto"
          class="hint">
        </div>

        <div
          id="preview"
          class="preview">

          <img
            id="previewImg"
            alt="照片預覽">

        </div>

      </div>


      <div class="full">

        <label>
          突破獎銜 *
        </label>

        <div
          id="awardGrid"
          class="award-grid">
        </div>

      </div>

    </div>


    <div class="actions">

      <button
        id="submitBtn"
        class="btn btn-gold"
        type="submit">
        提交表揚資料
      </button>

      <button
        id="cancelEditBtn"
        class="btn btn-dark"
        type="button"
        style="display:none;">
        取消修改
      </button>

    </div>

  </form>

</section>


<!-- MY RECORDS -->

<section
  id="recordsSection"
  class="card"
  style="display:none;">

  <div class="section-title">
    我的表揚資料
  </div>

  <div
    id="eventTabs"
    class="event-tabs">
  </div>

  <div
    id="recordsLoading"
    class="loading">
    正在讀取資料……
  </div>

  <div id="recordsList"></div>

</section>


<div class="admin-link">
  <a href="admin.html">
    管理員後台
  </a>
</div>

</div>


<iframe
  id="gasFrame"
  name="gasFrame"
  style="display:none;width:0;height:0;border:0;">
</iframe>


<script type="module">


/* =========================================================
   FIREBASE IMPORT
========================================================= */

import {
  initializeApp
} from "https://www.gstatic.com/firebasejs/12.2.1/firebase-app.js";

import {
  initializeAuth,
  getAuth,
  GoogleAuthProvider,
  signInWithPopup,
  signOut,
  onAuthStateChanged,
  indexedDBLocalPersistence,
  browserLocalPersistence,
  browserSessionPersistence,
  browserPopupRedirectResolver
} from "https://www.gstatic.com/firebasejs/12.2.1/firebase-auth.js";

import {
  getFirestore,
  collection,
  doc,
  getDoc,
  setDoc,
  updateDoc,
  deleteDoc,
  getDocs,
  query,
  where,
  serverTimestamp
} from "https://www.gstatic.com/firebasejs/12.2.1/firebase-firestore.js";


/* =========================================================
   FIREBASE CONFIG
========================================================= */

const firebaseConfig = {
  apiKey: "AIzaSyDpWeR78Lwfi9mDOS4mCzUsTYVI7SOsDVY",
  authDomain: "bsrecog.firebaseapp.com",
  projectId: "bsrecog",
  storageBucket: "bsrecog.firebasestorage.app",
  messagingSenderId: "104751827465",
  appId: "1:104751827465:web:ee5e360dedbd4a70b246d8",
  measurementId: "G-JEPWHQ6FQ9"
};


/* =========================================================
   IMPORTANT
   把你目前「已經可以收到照片」的 Apps Script
   /exec URL 放在這裡。
========================================================= */

const APPS_SCRIPT_URL =
  "https://script.google.com/macros/s/AKfycbycfMlsXP84tZxRB22oDpoAEStBqvi_dt3zhVsEzNJ9YKL75XEKIca-ZEl8weMl_iqe/exec";

const ADMIN_EMAIL = "diabolo.weien@gmail.com";


/* =========================================================
   DEFAULT SETTINGS
========================================================= */

const DEFAULT_PLATINUM_LIST = [
  "Sense&Lavenier",
  "Amos",
  "Sunny",
  "Robin&Zoey",
  "RyanLio",
  "Wyane&Momo",
  "Jess",
  "SzeChew",
  "Lynn",
  "Keong&Ngah"
];

const DEFAULT_AWARD_LIST = [
  "Silver Inner Circle",
  "Gold Inner Circle",
  "100% User",
  "100ppv",
  "3%",
  "300ppv",
  "600ppv",
  "6%",
  "1000ppv",
  "9%",
  "12%",
  "Bronze Foundation",
  "15%",
  "18%",
  "Bronze Builder",
  "Core",
  "Super core",
  "Silver producer",
  "Gold producer",
  "Platinum",
  "Founder Platinum"
];

// 上傳到 Drive 的照片：直向 3:4，最大寬度（高度 = 寬 x 4/3）
const UPLOAD_MAX_W = 960;

// 列表縮圖：直向 3:4，最大寬度
const THUMB_MAX_W = 180;


/* =========================================================
   INIT
========================================================= */

const app = initializeApp(firebaseConfig);

/*
  登入狀態保存：依序嘗試 IndexedDB → localStorage → sessionStorage，
  避免某些瀏覽器無法使用 IndexedDB 時登入狀態很快消失。
*/

let auth;

try {

  auth = initializeAuth(app, {
    persistence: [
      indexedDBLocalPersistence,
      browserLocalPersistence,
      browserSessionPersistence
    ],
    popupRedirectResolver: browserPopupRedirectResolver
  });

} catch (error) {

  console.warn("initializeAuth 失敗，改用 getAuth", error);

  auth = getAuth(app);

}

const db = getFirestore(app);

const provider = new GoogleAuthProvider();
provider.setCustomParameters({ prompt: "select_account" });


/* =========================================================
   DOM
========================================================= */

const googleLoginBtn = document.getElementById("googleLoginBtn");
const logoutBtn = document.getElementById("logoutBtn");
const loginArea = document.getElementById("loginArea");
const userArea = document.getElementById("userArea");
const userEmail = document.getElementById("userEmail");
const formSection = document.getElementById("formSection");
const recordsSection = document.getElementById("recordsSection");
const form = document.getElementById("recognitionForm");
const formTitle = document.getElementById("formTitle");
const eventBanner = document.getElementById("eventBanner");
const nameInput = document.getElementById("name");
const occupationInput = document.getElementById("occupation");
const platinumSelect = document.getElementById("platinum");
const photoInput = document.getElementById("photo");
const existingPhoto = document.getElementById("existingPhoto");
const preview = document.getElementById("preview");
const previewImg = document.getElementById("previewImg");
const awardGrid = document.getElementById("awardGrid");
const submitBtn = document.getElementById("submitBtn");
const cancelEditBtn = document.getElementById("cancelEditBtn");
const eventTabs = document.getElementById("eventTabs");
const recordsLoading = document.getElementById("recordsLoading");
const recordsList = document.getElementById("recordsList");
const messageBox = document.getElementById("message");


/* =========================================================
   STATE
========================================================= */

let currentUser = null;

let settings = {
  platinumList: [...DEFAULT_PLATINUM_LIST],
  awardList: [...DEFAULT_AWARD_LIST],
  events: [],
  currentEventId: "",
  legacyEventId: ""
};

let myRecords = [];
let activeEventTab = null;

let editingRecordId = null;
let editingRecord = null;
let loginInProgress = false;
let submitInProgress = false;

let wasLoggedIn = false;
let userInitiatedLogout = false;
let logoutTimer = null;


/* =========================================================
   MESSAGE
========================================================= */

function showMessage(text, type = "info") {

  messageBox.textContent = text;
  messageBox.className = "message " + type;

  window.scrollTo({
    top: 0,
    behavior: "smooth"
  });

}

function clearMessage() {

  messageBox.textContent = "";
  messageBox.className = "message";

}


/* =========================================================
   EVENT HELPERS（場次）
========================================================= */

function getEvent(id) {

  return settings.events.find(e => e.id === id) || null;

}

function getCurrentEvent() {

  return getEvent(settings.currentEventId);

}

/*
  舊資料沒有 eventId：
  歸到 legacyEventId（第一個場次）。
*/

function resolveRecordEventId(record) {

  if (record && record.eventId) {
    return record.eventId;
  }

  if (settings.legacyEventId) {
    return settings.legacyEventId;
  }

  if (settings.events.length) {
    return settings.events[0].id;
  }

  return "";

}


/* =========================================================
   LOGIN
========================================================= */

googleLoginBtn.addEventListener("click", async () => {

  if (loginInProgress) {
    return;
  }

  loginInProgress = true;
  googleLoginBtn.disabled = true;

  try {

    await signInWithPopup(auth, provider);

  } catch (error) {

    console.error("LOGIN ERROR", error);

    showMessage(
      "Google 登入失敗：\n" + getErrorMessage(error),
      "error"
    );

  } finally {

    loginInProgress = false;
    googleLoginBtn.disabled = false;

  }

});


/* =========================================================
   LOGOUT
========================================================= */

logoutBtn.addEventListener("click", async () => {

  userInitiatedLogout = true;

  try {

    await signOut(auth);

  } finally {

    setTimeout(() => {
      userInitiatedLogout = false;
    }, 1500);

  }

});


/* =========================================================
   AUTH
========================================================= */

function showLoggedOutUI() {

  loginArea.style.display = "block";
  userArea.style.display = "none";
  formSection.style.display = "none";
  recordsSection.style.display = "none";

}

onAuthStateChanged(auth, async user => {

  currentUser = user || null;

  if (!user) {

    /*
      不是自己按登出，卻突然變成未登入：
      先等 3 秒確認不是暫時狀態，
      還是未登入才切回登入畫面並提示。
    */

    if (wasLoggedIn && !userInitiatedLogout) {

      clearTimeout(logoutTimer);

      logoutTimer = setTimeout(() => {

        if (!auth.currentUser) {

          wasLoggedIn = false;

          showLoggedOutUI();

          showMessage(
            "登入狀態已中斷，請重新按「使用 Google 登入」。",
            "info"
          );

        }

      }, 3000);

      return;

    }

    wasLoggedIn = false;

    showLoggedOutUI();

    return;

  }

  clearTimeout(logoutTimer);

  wasLoggedIn = true;

  loginArea.style.display = "none";
  userArea.style.display = "block";
  formSection.style.display = "block";
  recordsSection.style.display = "block";

  userEmail.textContent = user.email || "";

  try {

    await loadSettings();

    renderSettings();

    refreshEventBanner();

    await loadMyRecords();

  } catch (error) {

    console.error(error);

    showMessage(
      "頁面初始化失敗：\n" + getErrorMessage(error),
      "error"
    );

  }

});


/* =========================================================
   SETTINGS
========================================================= */

async function loadSettings() {

  try {

    const ref = doc(db, "settings", "config");
    const snap = await getDoc(ref);

    if (snap.exists()) {

      const data = snap.data();

      if (Array.isArray(data.platinumList)) {
        settings.platinumList = data.platinumList;
      }

      if (Array.isArray(data.awardList)) {
        settings.awardList = data.awardList;
      }

      settings.events = Array.isArray(data.events)
        ? data.events
            .filter(e => e && e.id)
            .map(e => ({
              id: String(e.id),
              name: String(e.name || ""),
              monthKey: String(e.monthKey || ""),
              locked: !!e.locked,
              createdAt: Number(e.createdAt) || 0
            }))
        : [];

      settings.currentEventId =
        typeof data.currentEventId === "string"
          ? data.currentEventId
          : "";

      settings.legacyEventId =
        typeof data.legacyEventId === "string"
          ? data.legacyEventId
          : "";

    }

  } catch (error) {

    console.warn("settings read failed", error);

  }

}


/* =========================================================
   RENDER SETTINGS
========================================================= */

function renderSettings() {

  const keepPlatinum = platinumSelect.value;

  platinumSelect.innerHTML =
    '<option value="">請選擇上線白金</option>';

  settings.platinumList.forEach(item => {

    const option = document.createElement("option");
    option.value = item;
    option.textContent = item;

    platinumSelect.appendChild(option);

  });

  if (keepPlatinum) {
    platinumSelect.value = keepPlatinum;
  }

  const keepAwards = new Set(
    [...document.querySelectorAll('input[name="awards"]:checked')]
      .map(input => input.value)
  );

  awardGrid.innerHTML = "";

  settings.awardList.forEach((award, index) => {

    const id = "award_" + index;

    const wrapper = document.createElement("div");
    wrapper.className = "award-item";

    const input = document.createElement("input");
    input.type = "checkbox";
    input.name = "awards";
    input.id = id;
    input.value = award;
    input.checked = keepAwards.has(award);

    const label = document.createElement("label");
    label.htmlFor = id;
    label.textContent = award;

    wrapper.appendChild(input);
    wrapper.appendChild(label);

    awardGrid.appendChild(wrapper);

  });

}


/* =========================================================
   EVENT BANNER / FORM 可用狀態
========================================================= */

function setFormEnabled(enabled) {

  form.querySelectorAll("input,select,button").forEach(el => {

    if (el === cancelEditBtn) {
      return;
    }

    el.disabled = !enabled;

  });

}

function refreshEventBanner() {

  let text = "";
  let cls = "ok";
  let enabled = true;

  if (editingRecordId && editingRecord) {

    const ev = getEvent(resolveRecordEventId(editingRecord));

    if (!ev) {

      text = "找不到這筆資料所屬的場次，無法修改。";
      cls = "warn";
      enabled = false;

    } else if (ev.locked) {

      text = "「" + ev.name + "」已鎖定，無法修改。";
      cls = "warn";
      enabled = false;

    } else {

      text = "正在修改場次「" + ev.name + "」的資料。";

    }

  } else {

    const cur = getCurrentEvent();

    if (!cur) {

      text = "目前沒有開放填寫的表揚場次，請等候管理員開放。";
      cls = "warn";
      enabled = false;

    } else if (cur.locked) {

      text = "目前場次「" + cur.name + "」已鎖定，暫時無法新增。請等候管理員開放新場次。";
      cls = "warn";
      enabled = false;

    } else {

      text = "目前填寫場次：" + cur.name;

    }

  }

  eventBanner.textContent = text;
  eventBanner.className = "event-banner " + cls;

  setFormEnabled(enabled);

}


/* =========================================================
   PHOTO：置中放大、裁切成直向 3:4
   - dataUrl      上傳到 Drive（最大寬 960px，高 1280px）
   - thumbDataUrl 列表縮圖（最大寬 180px，高 240px）
========================================================= */

function processImage(file) {

  return new Promise((resolve, reject) => {

    const reader = new FileReader();

    reader.onload = event => {

      const img = new Image();

      img.onload = () => {

        const W = img.naturalWidth || img.width;
        const H = img.naturalHeight || img.height;

        if (!W || !H) {
          reject(new Error("圖片尺寸無法讀取"));
          return;
        }

        const RATIO = 3 / 4;

        let sx, sy, sw, sh;

        if (W / H > RATIO) {

          // 橫式或較寬的照片：左右裁掉
          sh = H;
          sw = H * RATIO;
          sx = (W - sw) / 2;
          sy = 0;

        } else {

          // 較窄的照片：上下裁掉
          sw = W;
          sh = W / RATIO;
          sx = 0;
          sy = (H - sh) / 2;

        }

        function render(maxW, quality) {

          const scale = Math.min(1, maxW / sw);

          const dw = Math.max(1, Math.round(sw * scale));
          const dh = Math.max(1, Math.round(dw * 4 / 3));

          const canvas = document.createElement("canvas");
          canvas.width = dw;
          canvas.height = dh;

          const ctx = canvas.getContext("2d");

          ctx.imageSmoothingQuality = "high";
          ctx.drawImage(img, sx, sy, sw, sh, 0, 0, dw, dh);

          return canvas.toDataURL("image/jpeg", quality);

        }

        resolve({
          dataUrl: render(UPLOAD_MAX_W, .88),
          thumbDataUrl: render(THUMB_MAX_W, .7),
          fileName: file.name.replace(/\.[^/.]+$/, "") + ".jpg"
        });

      };

      img.onerror = () => reject(new Error("圖片無法讀取"));

      img.src = event.target.result;

    };

    reader.onerror = () => reject(new Error("圖片讀取失敗"));

    reader.readAsDataURL(file);

  });

}

photoInput.addEventListener("change", async () => {

  const file = photoInput.files?.[0];

  if (!file) {
    preview.style.display = "none";
    return;
  }

  try {

    const processed = await processImage(file);

    previewImg.src = processed.dataUrl;
    preview.style.display = "block";

  } catch (error) {

    console.warn("preview failed", error);

    preview.style.display = "none";

  }

});


/* =========================================================
   SELECTED AWARDS
========================================================= */

function getSelectedAwards() {

  return [
    ...document.querySelectorAll('input[name="awards"]:checked')
  ].map(input => input.value);

}


/* =========================================================
   SUBMIT
========================================================= */

form.addEventListener("submit", async event => {

  event.preventDefault();

  if (!currentUser) {
    showMessage("請先 Google 登入。", "error");
    return;
  }

  if (submitInProgress) {
    return;
  }

  const name = nameInput.value.trim();
  const occupation = occupationInput.value.trim();
  const platinum = platinumSelect.value;
  const awards = getSelectedAwards();
  const selectedPhoto = photoInput.files?.[0];

  if (!name) {
    showMessage("請輸入表揚者姓名。", "error");
    return;
  }

  if (!occupation) {
    showMessage("請輸入表揚者職業。", "error");
    return;
  }

  if (!platinum) {
    showMessage("請選擇上線白金。", "error");
    return;
  }

  if (!awards.length) {
    showMessage("請至少選擇一個突破獎銜。", "error");
    return;
  }

  /* 照片為選填：不再檢查是否有選擇照片 */

  submitInProgress = true;
  submitBtn.disabled = true;
  cancelEditBtn.disabled = true;

  let recordId = editingRecordId;
  let newPhotoId = null;
  let oldPhotoId = editingRecord?.photoFileId || "";
  let targetEventId = "";

  try {

    /*
      =====================================================
      STEP 0
      重新讀取場次設定，確認場次沒有被鎖定 / 切換
      =====================================================
    */

    await loadSettings();

    if (editingRecordId) {

      targetEventId = resolveRecordEventId(editingRecord);

      const ev = getEvent(targetEventId);

      if (!ev) {
        throw new Error("找不到這筆資料所屬的場次，無法修改。");
      }

      if (ev.locked) {
        throw new Error("「" + ev.name + "」已被鎖定，無法修改。");
      }

    } else {

      const cur = getCurrentEvent();

      if (!cur) {
        throw new Error("目前沒有開放填寫的表揚場次。");
      }

      if (cur.locked) {
        throw new Error("目前場次「" + cur.name + "」已被鎖定，無法新增。");
      }

      targetEventId = cur.id;

    }

    /*
      =====================================================
      STEP 1
      先建立 / 確認 Firestore
      =====================================================
    */

    showMessage("① 正在建立表揚資料……", "info");

    if (!editingRecordId) {

      const newRef = doc(collection(db, "recognitions"));

      recordId = newRef.id;

      await setDoc(newRef, {
        uid: currentUser.uid,
        email: currentUser.email || "",
        eventId: targetEventId,
        name: name,
        occupation: occupation,
        platinum: platinum,
        awards: awards,
        photoFileId: "",
        photoFileName: "",
        photoDriveUrl: "",
        photoThumb: "",
        createdAt: serverTimestamp(),
        updatedAt: serverTimestamp()
      });

    } else {

      const recordRef = doc(db, "recognitions", editingRecordId);

      await updateDoc(recordRef, {
        uid: currentUser.uid,
        email: currentUser.email || "",
        eventId: targetEventId,
        name: name,
        occupation: occupation,
        platinum: platinum,
        awards: awards,
        updatedAt: serverTimestamp()
      });

    }

    /*
      =====================================================
      STEP 2
      有選照片才上傳（照片選填）
      =====================================================
    */

    if (selectedPhoto) {

      showMessage("② 表揚資料已建立，正在上傳照片……", "info");

      const processed = await processImage(selectedPhoto);

      const photoInfo = await postToAppsScript({
        action: "uploadPhoto",
        idToken: await currentUser.getIdToken(true),
        fileName: processed.fileName,
        mimeType: "image/jpeg",
        base64: processed.dataUrl
      });

      if (!photoInfo || !photoInfo.fileId) {
        throw new Error("Google Drive 沒有回傳有效的照片 fileId。");
      }

      newPhotoId = photoInfo.fileId;

      /*
        ===================================================
        STEP 3
        Drive 成功，更新 Firestore 照片資料
        ===================================================
      */

      showMessage("③ 照片已上傳，正在完成資料……", "info");

      const recordRef = doc(db, "recognitions", recordId);

      await updateDoc(recordRef, {
        photoFileId: photoInfo.fileId,
        photoFileName: photoInfo.fileName || "",
        photoDriveUrl: photoInfo.driveUrl || photoInfo.fileUrl || "",
        photoThumb: processed.thumbDataUrl || "",
        updatedAt: serverTimestamp()
      });

      /*
        編輯換照片：Firestore 已經成功，才刪除舊照片。
      */

      if (
        editingRecordId &&
        oldPhotoId &&
        oldPhotoId !== newPhotoId
      ) {

        try {

          await postToAppsScript({
            action: "deletePhoto",
            idToken: await currentUser.getIdToken(true),
            fileId: oldPhotoId
          });

        } catch (error) {

          console.warn("舊照片刪除失敗", error);

        }

      }

    }

    /*
      =====================================================
      成功
      =====================================================
    */

    const wasEditing = !!editingRecordId;

    showMessage(
      wasEditing
        ? "✅ 表揚資料修改成功！"
        : "✅ 表揚資料提交成功！",
      "success"
    );

    activeEventTab = targetEventId;

    resetForm();

    await loadMyRecords();

  } catch (error) {

    console.error("FINAL SUBMIT ERROR:", error);

    /*
      新建資料失敗：把剛建立的 Firestore 資料與 Drive 照片清掉。
    */

    if (!editingRecordId && recordId) {

      try {

        await deleteDoc(doc(db, "recognitions", recordId));

      } catch (cleanupError) {

        console.warn("Firestore cleanup failed", cleanupError);

      }

    }

    if (newPhotoId) {

      try {

        await postToAppsScript({
          action: "deletePhoto",
          idToken: await currentUser.getIdToken(true),
          fileId: newPhotoId
        });

      } catch (cleanupError) {

        console.warn("Drive cleanup failed", cleanupError);

      }

    }

    showMessage(
      "❌ 提交失敗：\n\n" + getErrorMessage(error),
      "error"
    );

    refreshEventBanner();

  } finally {

    submitInProgress = false;
    submitBtn.disabled = false;
    cancelEditBtn.disabled = false;

    refreshEventBanner();

  }

});


/* =========================================================
   LOAD MY RECORDS
========================================================= */

async function loadMyRecords() {

  recordsLoading.style.display = "block";
  recordsList.innerHTML = "";
  eventTabs.innerHTML = "";

  try {

    const q = query(
      collection(db, "recognitions"),
      where("uid", "==", currentUser.uid)
    );

    const snapshot = await getDocs(q);

    const records = [];

    snapshot.forEach(snap => {

      records.push({
        id: snap.id,
        ...snap.data()
      });

    });

    records.sort((a, b) => {

      const at = timestampValue(a.createdAt);
      const bt = timestampValue(b.createdAt);

      return bt - at;

    });

    myRecords = records;

    recordsLoading.style.display = "none";

    renderRecordsView();

  } catch (error) {

    console.error("LOAD ERROR", error);

    recordsLoading.style.display = "none";

    recordsList.innerHTML = `
      <div class="message error"
           style="display:block;">
        無法讀取資料。<br><br>
        ${escapeHtml(getErrorMessage(error))}
      </div>
    `;

  }

}


/* =========================================================
   RECORDS VIEW（依場次分頁）
========================================================= */

function renderRecordsView() {

  /* 依場次分組 */

  const groups = new Map();

  myRecords.forEach(record => {

    const eid = resolveRecordEventId(record);

    if (!groups.has(eid)) {
      groups.set(eid, []);
    }

    groups.get(eid).push(record);

  });

  /* 分頁：新的場次在前面；只顯示「有我的資料」或「進行中」的場次 */

  const tabs = [];

  [...settings.events]
    .sort((a, b) => (b.createdAt || 0) - (a.createdAt || 0))
    .forEach(ev => {

      const has = groups.has(ev.id);
      const isCurrent = ev.id === settings.currentEventId;

      if (has || isCurrent) {

        tabs.push({
          id: ev.id,
          name: ev.name,
          locked: !!ev.locked,
          current: isCurrent,
          count: (groups.get(ev.id) || []).length
        });

      }

    });

  if (groups.has("")) {

    tabs.push({
      id: "",
      name: "未分場次",
      locked: true,
      current: false,
      count: groups.get("").length
    });

  }

  eventTabs.innerHTML = "";
  recordsList.innerHTML = "";

  if (!tabs.length) {

    recordsList.innerHTML = `
      <div class="empty">
        目前還沒有表揚資料。
      </div>
    `;

    return;

  }

  if (!tabs.some(t => t.id === activeEventTab)) {

    const curTab = tabs.find(t => t.current);

    activeEventTab = curTab ? curTab.id : tabs[0].id;

  }

  tabs.forEach(tab => {

    const btn = document.createElement("button");

    btn.type = "button";

    btn.className =
      "event-tab" +
      (tab.id === activeEventTab ? " active" : "");

    btn.textContent =
      tab.name +
      (tab.locked ? " 🔒" : "") +
      (tab.current ? "（進行中）" : "") +
      "（" + tab.count + "）";

    btn.onclick = () => {
      activeEventTab = tab.id;
      renderRecordsView();
    };

    eventTabs.appendChild(btn);

  });

  const activeTab = tabs.find(t => t.id === activeEventTab);

  const activeRecords = groups.get(activeEventTab) || [];

  if (!activeRecords.length) {

    recordsList.innerHTML = `
      <div class="empty">
        這個場次目前還沒有你的表揚資料。
      </div>
    `;

    return;

  }

  activeRecords.forEach(record => {

    recordsList.appendChild(
      createRecordElement(record, !!(activeTab && activeTab.locked))
    );

  });

}


/* =========================================================
   RECORD
========================================================= */

function createRecordElement(record, locked) {

  const wrapper = document.createElement("div");
  wrapper.className = "record";

  const main = document.createElement("div");
  main.className = "record-main";

  /*
    縮圖來源：
    1. 上傳時產生的小縮圖 photoThumb（存在 Firestore，不需要 Drive 權限）
    2. 舊資料沒有 photoThumb 時，退回用 Drive 縮圖網址
    3. 都沒有（沒上傳照片）就不顯示
  */

  const img = document.createElement("img");
  img.className = "record-photo";

  const thumbSrc =
    record.photoThumb ||
    (
      record.photoFileId
        ? "https://drive.google.com/thumbnail?id=" +
          encodeURIComponent(record.photoFileId) +
          "&sz=w200"
        : ""
    );

  if (thumbSrc) {

    img.src = thumbSrc;

    img.onerror = () => {
      img.style.display = "none";
    };

  } else {

    img.style.display = "none";

  }

  const content = document.createElement("div");

  const name = document.createElement("div");
  name.className = "record-name";
  name.textContent = record.name || "";

  const meta = document.createElement("div");
  meta.className = "record-meta";
  meta.textContent =
    (record.occupation || "") +
    " ｜ 上線白金：" +
    (record.platinum || "");

  const tags = document.createElement("div");
  tags.className = "award-tags";

  (Array.isArray(record.awards) ? record.awards : []).forEach(award => {

    const tag = document.createElement("span");
    tag.className = "tag";
    tag.textContent = award;

    tags.appendChild(tag);

  });

  content.appendChild(name);
  content.appendChild(meta);
  content.appendChild(tags);

  main.appendChild(img);
  main.appendChild(content);

  wrapper.appendChild(main);

  if (locked) {

    const note = document.createElement("div");
    note.className = "record-locked";
    note.textContent = "🔒 此場次已鎖定，無法修改或刪除。";

    wrapper.appendChild(note);

    return wrapper;

  }

  const actions = document.createElement("div");
  actions.className = "record-actions";

  const editBtn = document.createElement("button");
  editBtn.className = "btn btn-dark btn-small";
  editBtn.textContent = "修改";
  editBtn.type = "button";
  editBtn.onclick = () => {
    startEdit(record);
  };

  const deleteBtn = document.createElement("button");
  deleteBtn.className = "btn btn-danger btn-small";
  deleteBtn.textContent = "刪除";
  deleteBtn.type = "button";
  deleteBtn.onclick = () => {
    deleteRecord(record);
  };

  actions.appendChild(editBtn);
  actions.appendChild(deleteBtn);

  wrapper.appendChild(actions);

  return wrapper;

}


/* =========================================================
   EDIT
========================================================= */

function startEdit(record) {

  const ev = getEvent(resolveRecordEventId(record));

  if (!ev || ev.locked) {

    showMessage(
      "這個場次已鎖定，無法修改。",
      "error"
    );

    return;

  }

  editingRecordId = record.id;
  editingRecord = record;

  formTitle.textContent = "修改表揚資料";

  nameInput.value = record.name || "";
  occupationInput.value = record.occupation || "";
  platinumSelect.value = record.platinum || "";

  document
    .querySelectorAll('input[name="awards"]')
    .forEach(input => {

      input.checked =
        Array.isArray(record.awards) &&
        record.awards.includes(input.value);

    });

  photoInput.value = "";

  existingPhoto.textContent =
    record.photoFileId
      ? "目前已有照片。如果不選新照片，會保留原照片。"
      : "目前沒有照片（簡報會使用預設照片）。";

  preview.style.display = "none";

  submitBtn.textContent = "儲存修改";

  cancelEditBtn.style.display = "inline-block";

  refreshEventBanner();

  formSection.scrollIntoView({
    behavior: "smooth"
  });

}


/* =========================================================
   CANCEL
========================================================= */

cancelEditBtn.addEventListener("click", () => {

  resetForm();
  clearMessage();

});


/* =========================================================
   RESET
========================================================= */

function resetForm() {

  editingRecordId = null;
  editingRecord = null;

  form.reset();

  formTitle.textContent = "新增表揚資料";

  submitBtn.textContent = "提交表揚資料";

  cancelEditBtn.style.display = "none";

  existingPhoto.textContent = "";

  preview.style.display = "none";

  refreshEventBanner();

}


/* =========================================================
   DELETE
========================================================= */

async function deleteRecord(record) {

  if (!currentUser) {
    return;
  }

  /* 重新讀取場次，確認沒有被鎖定 */

  await loadSettings();

  const ev = getEvent(resolveRecordEventId(record));

  if (!ev || ev.locked) {

    showMessage(
      "這個場次已鎖定，無法刪除。",
      "error"
    );

    await loadMyRecords();

    return;

  }

  if (!confirm("確定要刪除「" + record.name + "」嗎？")) {
    return;
  }

  try {

    showMessage("正在刪除資料……", "info");

    await deleteDoc(doc(db, "recognitions", record.id));

    if (record.photoFileId) {

      try {

        await postToAppsScript({
          action: "deletePhoto",
          idToken: await currentUser.getIdToken(true),
          fileId: record.photoFileId
        });

      } catch (error) {

        console.warn("Drive delete failed", error);

      }

    }

    showMessage("資料已刪除。", "success");

    await loadMyRecords();

  } catch (error) {

    console.error(error);

    showMessage(
      "刪除失敗：\n" + getErrorMessage(error),
      "error"
    );

  }

}


/* =========================================================
   APPS SCRIPT POST
   透過隱藏 iframe 送出表單，
   再等 Apps Script 用 postMessage 回傳結果。
========================================================= */

function postToAppsScript(data) {

  return new Promise((resolve, reject) => {

    if (
      !APPS_SCRIPT_URL ||
      !APPS_SCRIPT_URL.includes("script.google.com/macros/s/")
    ) {

      reject(new Error("Apps Script /exec URL 沒有正確設定。"));
      return;

    }

    const iframe = document.getElementById("gasFrame");

    if (!iframe) {

      reject(new Error("找不到 gasFrame iframe。"));
      return;

    }

    /* 建立唯一 requestId */

    const requestId =
      "req_" +
      Date.now() +
      "_" +
      Math.random().toString(36).substring(2, 10);

    /* 一起傳給 Apps Script；responseMode 告訴後端用 postMessage 回覆 */

    const requestData = {
      ...data,
      requestId: requestId,
      responseMode: "postMessage"
    };

    /* 建立 POST FORM */

    const postForm = document.createElement("form");

    postForm.method = "POST";
    postForm.action = APPS_SCRIPT_URL;
    postForm.target = "gasFrame";
    postForm.style.display = "none";

    Object.keys(requestData).forEach(key => {

      const input = document.createElement("input");

      input.type = "hidden";
      input.name = key;
      input.value = requestData[key] ?? "";

      postForm.appendChild(input);

    });

    document.body.appendChild(postForm);

    let finished = false;

    /* 5 分鐘逾時 */

    const timeout = setTimeout(() => {

      if (finished) {
        return;
      }

      finished = true;

      cleanup();

      reject(new Error(
        "Google Drive 服務回覆逾時。\n\n" +
        "照片可能已經成功上傳到 Google Drive，" +
        "但前端沒有收到 Apps Script 的完成訊號。\n\n" +
        "請先不要重複提交。"
      ));

    }, 300000);

    function cleanup() {

      clearTimeout(timeout);

      window.removeEventListener("message", onMessage);

      try {
        postForm.remove();
      } catch (error) {}

    }

    /* 收到 Apps Script 回覆 */

    function onMessage(event) {

      const result = event.data;

      if (!result || typeof result !== "object") {
        return;
      }

      if (
        result.action !== "uploadPhoto" &&
        result.action !== "deletePhoto" &&
        result.action !== "generatePpt"
      ) {
        return;
      }

      if (
        result.requestId &&
        result.requestId !== requestId
      ) {
        return;
      }

      if (finished) {
        return;
      }

      finished = true;

      cleanup();

      if (result.success) {

        resolve(result.result);
        return;

      }

      reject(new Error(result.error || "Apps Script 執行失敗"));

    }

    /* 一定先監聽 message，再 submit */

    window.addEventListener("message", onMessage);

    try {

      postForm.submit();

    } catch (error) {

      if (!finished) {

        finished = true;

        cleanup();

        reject(error);

      }

    }

  });

}


/* =========================================================
   ERROR
========================================================= */

function getErrorMessage(error) {

  if (!error) {
    return "未知錯誤";
  }

  const code = error.code || "";
  const message = error.message || String(error);

  return (
    "錯誤代碼：" + (code || "無") +
    "\n\n" +
    "錯誤內容：" + message
  );

}


/* =========================================================
   TIMESTAMP
========================================================= */

function timestampValue(value) {

  if (!value) {
    return 0;
  }

  if (typeof value.toMillis === "function") {
    return value.toMillis();
  }

  if (value.seconds !== undefined) {
    return Number(value.seconds) * 1000;
  }

  return 0;

}


/* =========================================================
   ESCAPE
========================================================= */

function escapeHtml(value) {

  return String(value)
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#039;");

}
